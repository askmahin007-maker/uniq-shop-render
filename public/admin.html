<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniq Shop Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#fdf8ec]">
<div class="bg-[#0a3d2e] text-white p-4 sticky top-0 z-50"><h1 class="text-2xl font-black">🛠️ Uniq Shop এডমিন</h1><p class="text-xs">সব কিছু এখান থেকে কাস্টমাইজ করো - কোডে হাত দিতে হবে না</p></div>
<div id="loginBox" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow"><h2 class="text-center font-bold">এডমিন কী দিয়ে লগইন করো</h2><input id="adminKeyInput" placeholder="Admin key" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করো</button></div>
<div id="adminBox" class="hidden p-3 max-w-3xl mx-auto"><div class="flex gap-2 overflow-x-auto" id="tabs"></div><div id="content" class="mt-3"></div><a href="/" class="block text-center underline mt-4">← Shop e Jao</a></div>
<script>
let KEY=localStorage.getItem('uniq_admin_key')||'', PRODUCTS=[], ORDERS=[], FEEDBACKS=[], FAQS=[], SETTINGS={}, COUPONS=[], tab='dashboard', editId=null, orderSearch='', orderFilter='All', newImgs=[];
async function api(url, opt={}){ opt.headers={...(opt.headers||{}), 'x-admin-key':KEY, 'Content-Type':'application/json'}; let r=await fetch(url,opt); if(r.status===401){ alert('Admin Key vul'); throw new Error('auth'); } return r.json(); }
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); let r=await fetch('/api/check-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}); let j=await r.json(); if(!j.ok){alert('Key vul');return} KEY=k; localStorage.setItem('uniq_admin_key',k); init(); }
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); }
async function refresh(){ PRODUCTS=await fetch('/api/products').then(r=>r.json()); ORDERS=await api('/api/admin/orders'); FEEDBACKS=await api('/api/admin/feedbacks'); FAQS=await fetch('/api/faqs').then(r=>r.json()); SETTINGS=await fetch('/api/settings').then(r=>r.json()); COUPONS=SETTINGS.coupons||[{code:'UNIQ10',off:10,active:true}]; }
function cleanPhone2(p){ return (p||'').replace(/[^0-9]/g,''); }

function render(){ document.getElementById('tabs').innerHTML=[['dashboard','📊 Dashboard'],['products','📦 পণ্য'],['orders','অর্ডার'],['coupons','🎟️ Coupon'],['delivery','🚚 Delivery'],['feedback','⭐ Review'],['settings','⚙️ Settings']].map(t=>`<button onclick="tab='${t[0]}';render()" class="whitespace-nowrap px-4 py-2 rounded-lg font-bold ${tab===t[0]?'bg-[#0a3d2e] text-white':'bg-white border'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let today=new Date().toDateString(); let todayOrders=ORDERS.filter(o=>new Date(o.date).toDateString()===today); let pending=ORDERS.filter(o=>o.status==='Pending'||o.status==='pending'); let totalSale=ORDERS.filter(o=>o.status!=='Rejected').reduce((s,o)=>s+(parseInt(o.total)||0),0); let low=PRODUCTS.filter(p=>p.stock<=5); h=`<div class="grid grid-cols-2 gap-2"><div class="bg-white p-4 rounded-2xl"><p class="text-xs">আজকের অর্ডার</p><b class="text-2xl">${todayOrders.length} টা</b></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs">মোট সেল</p><b class="text-2xl">৳${totalSale}</b></div><div class="bg-yellow-100 p-4 rounded-2xl"><p class="text-xs">⏳ Pending</p><b class="text-2xl">${pending.length} টা</b></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs">মোট প্রোডাক্ট</p><b class="text-2xl">${PRODUCTS.length} টা</b></div></div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">🎟️ Active Coupon: ${COUPONS.filter(c=>c.active).map(c=>c.code+' - '+c.off+'%').join(', ')||'নাই'}</h3><p class="text-sm">🚚 Delivery: Dhaka ৳${SETTINGS.deliveryDhaka||60} | Baire ৳${SETTINGS.deliveryOutside||130} | Free ${SETTINGS.freeAbove||'0'} টাকার উপরে</p></div><div class="bg-red-50 p-3 rounded-2xl mt-3"><h3 class="font-black text-red-600">📦 Low Stock</h3>${low.length?low.map(p=>`<p class="text-sm">⚠️ ${p.name} - Stock: <b>${p.stock}</b></p>`).join(''):'<p class="text-sm">✅ Sob thik ase</p>'}</div>`; }
if(tab==='products'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4"><h3 class="font-black text-lg">➕ নতুন পণ্য যোগ করো</h3><input id="npName" placeholder="পণ্যের নাম" class="w-full border rounded-lg p-3 mt-3"><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">দাম (৳) *</label><input id="npPrice" type="number" placeholder="1300" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">আগের দাম</label><input id="npOld" type="number" placeholder="1500" class="w-full border rounded-lg p-2"></div></div><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">স্টক</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ক্যাটাগরি</label><select id="npCat" class="w-full border rounded-lg p-2"><option>Summer</option><option>Winter</option><option>Electronics</option><option>Fashion</option><option>Home</option></select></div></div><label class="block text-sm mt-3 font-bold">🏷️ Badge - Shop e ki dekhabe?</label><select id="npBadge" class="w-full border rounded-lg p-2 mt-1"><option value="">কোনো Badge না</option><option>🔥 Best Seller</option><option>✨ New</option><option>💥 Hot Deal</option><option>⚡ Limited</option></select><label class="block text-sm mt-3 font-bold">📸 Product er Pic</label><div class="grid grid-cols-2 gap-2 mt-2"><label class="bg-pink-600 text-white text-center py-3 rounded-xl font-bold cursor-pointer">📸 Camera দিয়ে তোলো<input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleNewImgs(this)"></label><label class="bg-gray-900 text-white text-center py-3 rounded-xl font-bold cursor-pointer">🖼️ Gallery থেকে নাও<input type="file" accept="image/*" multiple class="hidden" onchange="handleNewImgs(this)"></label></div><div id="newPreview" class="flex gap-2 flex-wrap mt-3">${newImgs.map((im,i)=>`<div class="relative"><img src="${im}" class="w-20 h-20 object-cover rounded-xl"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'}</div><label class="block text-sm mt-3">বিবরণ</label><textarea id="npDesc" placeholder="কাপড়টা কেমন..." class="w-full border rounded-lg p-2"></textarea><button onclick="addProduct()" class="w-full bg-yellow-500 py-4 rounded-xl font-black mt-3 text-lg">✅ পণ্য যোগ করো</button></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold mt-3">🔄 রিফ্রেশ</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 ${p.stock<=5?'border-2 border-red-500':''}"><div class="flex justify-between"><b>${p.name} ${p.badge||''}</b><div class="flex gap-1"><button onclick="editId=${p.id};render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct(${p.id})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • স্টক: <b>${p.stock}</b> ${p.stock==0?'<span class="text-red-600 font-bold">- STOCK OUT - Order Off</span>':''}</p><div class="flex gap-1 mt-2">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')||'Kono pic nai'}</div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><select id="eBadge${p.id}" class="w-full border rounded-lg p-2 mt-1"><option value="">Badge nai</option><option ${p.badge==='🔥 Best Seller'?'selected':''}>🔥 Best Seller</option><option ${p.badge==='✨ New'?'selected':''}>✨ New</option><option ${p.badge==='💥 Hot Deal'?'selected':''}>💥 Hot Deal</option></select><button onclick="saveEdit(${p.id})" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">Save Edit</button></div>`:''}</div>`).join('')}</div>`; }
if(tab==='coupons'){ h=`<div class="bg-white p-4 rounded-2xl"><h3 class="font-black text-lg">🎟️ Coupon বানাও - Admin থেকে</h3><p class="text-xs text-gray-500">Customer Shop e ei code dile discount pabe</p><input id="cpCode" placeholder="Coupon Code - jemon EID20" class="w-full border rounded-lg p-3 mt-3"><input id="cpOff" type="number" placeholder="Discount % - jemon 20" class="w-full border rounded-lg p-3 mt-2"><label class="flex items-center gap-2 mt-2"><input id="cpActive" type="checkbox" checked> Active - ekhon cholbe</label><button onclick="addCoupon()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold mt-3">➕ Coupon Add Koro</button></div><div class="mt-3 space-y-2">${COUPONS.map((c,i)=>`<div class="bg-white p-3 rounded-xl flex justify-between items-center"><div><b>${c.code}</b> - ${c.off}% OFF <span class="${c.active?'text-green-600':'text-red-500'}">${c.active?'✅ Active':'❌ Off'}</span></div><div class="flex gap-1"><button onclick="toggleCoupon(${i})" class="bg-yellow-100 px-2 py-1 rounded-lg">${c.active?'Off koro':'On koro'}</button><button onclick="delCoupon(${i})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div>`).join('')||'Kono coupon nai'}</div>`; }
if(tab==='delivery'){ h=`<div class="bg-white p-4 rounded-2xl"><h3 class="font-black text-lg">🚚 Delivery Settings - Admin থেকে বদলাও</h3><label class="block mt-3">Dhaka er Vitore (৳)</label><input id="dDhaka" value="${SETTINGS.deliveryDhaka||60}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3">Dhaka er Baire (৳)</label><input id="dOutside" value="${SETTINGS.deliveryOutside||130}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3">Free Delivery - Koto Takar Upore? (0 dile Free Delivery off)</label><input id="dFree" value="${SETTINGS.freeAbove||0}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3">Delivery Time - Customer ke ki dekhabe?</label><input id="dTime" value="${SETTINGS.deliveryTime||'Dhaka te 24h, Baire 2-3 din'}" class="w-full border rounded-lg p-2"><button onclick="saveDelivery()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold mt-3">✅ Delivery Save Koro</button></div>`; }
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); return (!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)) && (orderFilter==='All'||o.status===orderFilter); }); h=`<div class="flex gap-2"><button onclick="refresh().then(render)" class="flex-1 bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><button onclick="exportOrders()" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold">📥 Excel</button></div><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 Nam / Phone" class="w-full border rounded-xl p-3 mt-2"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2"><option value="All">সব অর্ডার (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Shipped">📦 Shipped</option><option value="Delivered">🚚 Delivered</option><option value="Rejected">❌ Rejected</option></select><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl"><b>${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs">${o.status}</span><p class="text-sm">${o.name} | ${o.phone}</p><p class="text-sm">${o.address}</p><p class="text-xs">${o.items}</p><p class="text-xs text-gray-500">${o.date}</p><div class="flex gap-1 mt-2 flex-wrap">${o.status==='Pending'?`<button onclick="updateOrder('${o.id}','Approved')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">✅ Approve</button><button onclick="updateOrder('${o.id}','Rejected')" class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs">❌ Reject</button>`:''}${o.status==='Approved'?`<button onclick="updateOrder('${o.id}','Shipped')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs">📦 Shipped</button>`:''}${o.status==='Shipped'?`<button onclick="updateOrder('${o.id}','Delivered')" class="bg-green-700 text-white px-3 py-1 rounded-full text-xs">🚚 Delivered</button>`:''}<button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">Delete</button></div></div>`).join(''):'<p class="text-center py-8">Kono order nai</p>'}</div>`; }
if(tab==='feedback'){ h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><div class="mt-3 space-y-2">${FEEDBACKS.length?FEEDBACKS.map(f=>`<div class="bg-white p-3 rounded-xl"><b>${f.name} - ⭐ ${f.rating||5}</b><p class="text-sm">${f.text}</p><p class="text-xs">${f.date}</p><button onclick="delFb(${f.id})" class="text-red-500 text-xs">Delete</button></div>`).join(''):'<p class="text-center py-8">Kono review nai</p>'}</div>`; }
if(tab==='settings'){ h=`<div class="bg-white p-4 rounded-2xl"><h3 class="font-black text-lg">⚙️ Settings</h3><label class="block mt-3">WhatsApp / Chat Number</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">যোগাযোগের সময়</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">bKash Number</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3">Shop er Nam</label><input id="setShop" value="${SETTINGS.shopName||'UNIQ SHOP'}" class="w-full border rounded-lg p-2"><label class="block mt-3">Admin Password (bodlate chaile)</label><input id="setPass" placeholder="Notun password" class="w-full border rounded-lg p-2"><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">সেভ</button></div>`; }
document.getElementById('content').innerHTML=h; }
async function handleNewImgs(inp){ let files=[...inp.files]; for(let f of files){ let d=await new Promise(res=>{let r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); newImgs.push(d); } renderNewPreview(); }
function renderNewPreview(){ let el=document.getElementById('newPreview'); if(!el) return; el.innerHTML=newImgs.map((im,i)=>`<div class="relative"><img src="${im}" class="w-20 h-20 object-cover rounded-xl"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'; }
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){alert('Nam + Dam dao');return} let imgs=[...newImgs]; await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n,cat:document.getElementById('npCat').value,price:pr,old,stock:st,rating:4.8,badge:document.getElementById('npBadge').value,emoji:'📦',desc:document.getElementById('npDesc').value,images:imgs,variants:[]})}); newImgs=[]; await refresh(); render(); alert('✅ Product add hoise!'); }
async function delProduct(id){ if(!confirm('Delete korba?'))return; await api('/api/admin/products/'+id,{method:'DELETE'}); await refresh(); render(); }
async function saveEdit(id){ await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('eName'+id).value,price:parseInt(document.getElementById('ePrice'+id).value),stock:parseInt(document.getElementById('eStock'+id).value),badge:document.getElementById('eBadge'+id).value})}); editId=null; await refresh(); render(); }
async function addCoupon(){ let code=document.getElementById('cpCode').value.trim().toUpperCase(), off=parseInt(document.getElementById('cpOff').value); if(!code||!off){alert('Code + % dao');return} COUPONS.push({code,off,active:document.getElementById('cpActive').checked}); await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); alert('✅ Coupon add hoise - Customer ekhon use korte parbe!'); }
async function toggleCoupon(i){ COUPONS[i].active=!COUPONS[i].active; await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); }
async function delCoupon(i){ COUPONS.splice(i,1); await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); }
async function saveDelivery(){ await api('/api/admin/settings',{method:'POST',body:JSON.stringify({deliveryDhaka:document.getElementById('dDhaka').value, deliveryOutside:document.getElementById('dOutside').value, freeAbove:document.getElementById('dFree').value, deliveryTime:document.getElementById('dTime').value})}); alert('✅ Delivery Save Hoise!'); await refresh(); render(); }
async function saveSettings(){ let body={ chatNumber: document.getElementById('setChat').value, contactTime: document.getElementById('setTime').value, bkashNumber: document.getElementById('setBkash').value, shopName: document.getElementById('setShop').value }; let np=document.getElementById('setPass').value.trim(); if(np) body.adminKey=np; await api('/api/admin/settings',{method:'POST',body:JSON.stringify(body)}); if(np){ KEY=np; localStorage.setItem('uniq_admin_key',np); } alert('✅ Settings Save Hoise!'); location.reload(); }
function cleanPhone(p){ let c=(p||'').replace(/[^0-9]/g,''); if(c.startsWith('0')) c='880'+c.slice(1); return c; }
async function updateOrder(id,status){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status})}); await refresh(); render(); let msg={Approved:'✅ ORDER CONFIRMED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' APPROVED hoye gese. Total: ৳'+o.total, Shipped:'📦 SHIPPED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' Pathano hoye gese!', Delivered:'🚚 DELIVERED - UNIQ SHOP\nHello '+o.name+'! Order '+o.orderId+' Delivered - Dhonnobad!' }[status]; if(msg) window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent(msg), '_blank'); }
async function delOrder(id){ if(!confirm('Delete?'))return; await api('/api/admin/orders/'+id,{method:'DELETE'}); await refresh(); render(); }
function exportOrders(){ let rows=[['OrderID','Name','Phone','Address','Items','Total','Status','Date']]; ORDERS.forEach(o=>rows.push([o.orderId,o.name,o.phone,(o.address||'').replace(/,/g,' '),(o.items||'').replace(/,/g,' '),o.total,o.status,o.date])); let csv=rows.map(r=>r.join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='uniq-orders.csv'; a.click(); }
async function delFb(id){ await api('/api/admin/feedbacks/'+id,{method:'DELETE'}); await refresh(); render(); }
if(KEY) init();
</script></body></html>
