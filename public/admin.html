<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniq Shop Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#fdf8ec]">
<div class="bg-[#0a3d2e] text-white p-4 sticky top-0 z-50"><h1 class="text-2xl font-black">🛠️ Uniq Shop এডমিন</h1><p class="text-xs">📱 Phone thekei Product Add korte parba - Jekhan theke khusi</p></div>
<div id="loginBox" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow"><h2 class="text-center font-bold">এডমিন কী দিয়ে লগইন করো</h2><input id="adminKeyInput" placeholder="Admin key" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করো</button></div>
<div id="adminBox" class="hidden p-3 max-w-3xl mx-auto"><div class="flex gap-2 overflow-x-auto" id="tabs"></div><div id="content" class="mt-3"></div><a href="/" class="block text-center underline mt-4">← Shop e Jao</a></div>
<script>
let KEY=localStorage.getItem('uniq_admin_key')||'', PRODUCTS=[], ORDERS=[], FEEDBACKS=[], FAQS=[], SETTINGS={}, tab='dashboard', editId=null, orderSearch='', orderFilter='All', newImgs=[];
async function api(url, opt={}){ opt.headers={...(opt.headers||{}), 'x-admin-key':KEY, 'Content-Type':'application/json'}; let r=await fetch(url,opt); if(r.status===401){ alert('Admin Key vul'); throw new Error('auth'); } return r.json(); }
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); let r=await fetch('/api/check-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}); let j=await r.json(); if(!j.ok){alert('Key vul');return} KEY=k; localStorage.setItem('uniq_admin_key',k); init(); }
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); }
async function refresh(){ PRODUCTS=await fetch('/api/products').then(r=>r.json()); ORDERS=await api('/api/admin/orders'); FEEDBACKS=await api('/api/admin/feedbacks'); FAQS=await fetch('/api/faqs').then(r=>r.json()); SETTINGS=await fetch('/api/settings').then(r=>r.json()); }
function cleanPhone2(p){ return (p||'').replace(/[^0-9]/g,''); }
function parseDate(d){ if(!d) return new Date(0); if(typeof d==='number') return new Date(d); let m=String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(m[3], m[2]-1, m[1]); return new Date(d); }
function isFake(o){ let ph=cleanPhone2(o.phone); let today=new Date().toDateString(); let c=ORDERS.filter(x=>cleanPhone2(x.phone)===ph && (x.status==='Pending'||x.status==='pending') && parseDate(x.date).toDateString()===today).length; return c>=3; }
function exportOrders(){ let rows=[['OrderID','Name','Phone','Address','Items','Total','Status','Date','Payment','TrxID']]; ORDERS.forEach(o=>rows.push([o.orderId,o.name,o.phone,(o.address||'').replace(/,/g,' '),(o.items||'').replace(/,/g,' '),o.total,o.status,o.date,o.payment||'COD',o.trxId||''])); let csv=rows.map(r=>r.join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='uniq-orders.csv'; a.click(); }
// --- NEW PRODUCT PHOTO FROM ANYWHERE ---
async function handleNewImgs(inp){ let files=[...inp.files]; for(let f of files){ let d=await new Promise(res=>{let r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); newImgs.push(d); } renderNewPreview(); }
function renderNewPreview(){ let el=document.getElementById('newPreview'); if(!el) return; el.innerHTML=newImgs.map((im,i)=>`<div class="relative"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'; }
function render(){ document.getElementById('tabs').innerHTML=[['dashboard','📊 Dashboard'],['products','📦 পণ্য Add'],['orders','অর্ডার'],['faq','প্রশ্নোত্তর'],['feedback','Feedback'],['settings','Settings']].map(t=>`<button onclick="tab='${t[0]}';render()" class="whitespace-nowrap px-4 py-2 rounded-lg font-bold ${tab===t[0]?'bg-[#0a3d2e] text-white':'bg-white border'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let today=new Date().toDateString(); let todayOrders=ORDERS.filter(o=>parseDate(o.date).toDateString()===today); let pending=ORDERS.filter(o=>o.status==='Pending'||o.status==='pending'); let totalSale=ORDERS.filter(o=>o.status!=='Rejected').reduce((s,o)=>s+(parseInt(o.total)||0),0); let low=PRODUCTS.filter(p=>p.stock<=5); h=`<div class="bg-green-100 p-3 rounded-2xl"><b>📱 Phone thekei Product Add kora jabe!</b><p class="text-sm">Market e giye pic tulo > Admin e dhuko > Product Add koro > Sobai dekhbe</p><button onclick="tab='products';render()" class="bg-[#0a3d2e] text-white px-4 py-2 rounded-full font-bold mt-2">➕ Ekhoni Product Add Koro →</button></div><div class="grid grid-cols-2 gap-2 mt-3"><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">আজকের অর্ডার</p><b class="text-2xl">${todayOrders.length} টা</b></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">মোট সেল</p><b class="text-2xl">৳${totalSale}</b></div><div class="bg-yellow-100 p-4 rounded-2xl"><p class="text-xs">⏳ Pending</p><b class="text-2xl">${pending.length} টা</b></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">মোট প্রোডাক্ট</p><b class="text-2xl">${PRODUCTS.length} টা</b></div></div><div class="bg-red-50 border border-red-200 p-3 rounded-2xl mt-3"><h3 class="font-black text-red-600">📦 Low Stock (5 বা কম)</h3>${low.length?low.map(p=>`<p class="text-sm">⚠️ ${p.name} - Stock: <b>${p.stock}</b></p>`).join(''):'<p class="text-sm">✅ Sob stock thik ase</p>'}</div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">🕐 সর্বশেষ 5 টা অর্ডার</h3>${ORDERS.slice(0,5).map(o=>`<p class="text-sm border-b py-1"><b>${o.orderId}</b> - ${o.name} - ৳${o.total} - ${o.status} ${isFake(o)?'<span class="text-red-600 font-bold">⚠️ FAKE</span>':''}</p>`).join('')||'Kono order nai'}</div>`; }
if(tab==='products'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4"><h3 class="font-black text-lg">➕ নতুন পণ্য যোগ করো - Jekhan theke khusi</h3><p class="text-xs text-gray-500">Phone diye pic tulei add koro, sob user sathe sathe dekhbe</p><input id="npName" placeholder="পণ্যের নাম - jemon: Panjabi Premium" class="w-full border rounded-lg p-3 mt-3"><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">দাম (৳) *</label><input id="npPrice" type="number" placeholder="1300" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">আগের দাম</label><input id="npOld" type="number" placeholder="1500" class="w-full border rounded-lg p-2"></div></div><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">স্টক</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ক্যাটাগরি</label><select id="npCat" class="w-full border rounded-lg p-2"><option>Summer</option><option>Winter</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Books</option></select></div></div><label class="block text-sm mt-3 font-bold">📸 Product er Pic - Pic soho add koro</label><div class="grid grid-cols-2 gap-2 mt-2"><label class="bg-pink-600 text-white text-center py-3 rounded-xl font-bold cursor-pointer">📸 Camera diye Tulo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleNewImgs(this)"></label><label class="bg-gray-900 text-white text-center py-3 rounded-xl font-bold cursor-pointer">🖼️ Gallery theke Nao<input type="file" accept="image/*" multiple class="hidden" onchange="handleNewImgs(this)"></label></div><div id="newPreview" class="flex gap-2 flex-wrap mt-3">${newImgs.map((im,i)=>`<div class="relative"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai - Camera / Gallery theke pic dao</p>'}</div><label class="block text-sm mt-3">ইমোজি (Pic na thakle dekhabe)</label><input id="npEmoji" value="📦" class="w-full border rounded-lg p-2"><label class="block text-sm mt-2">বিবরণ</label><textarea id="npDesc" placeholder="Kapor ta kemon, size ki ki ase..." class="w-full border rounded-lg p-2"></textarea><label class="block text-sm mt-2">Highlights (Proti line e 1 ta)</label><textarea id="npHigh" placeholder="১০০% অরিজিনাল&#10;৭ দিনের রিটার্ন" class="w-full border rounded-lg p-2"></textarea><label class="block text-sm mt-2">Image URL (Chaile link o dite parba)</label><input id="npImg" placeholder="https://..." class="w-full border rounded-lg p-2"><button onclick="addProduct()" class="w-full bg-yellow-500 py-4 rounded-xl font-black mt-3 text-lg">✅ পণ্য যোগ করো - Sobai Dekhbe</button><p class="text-xs text-center mt-1">Add korar por Shop e giye dekhba - sathe sathe chole asche</p></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 border-[#0a3d2e] py-2 rounded-xl font-bold mt-3">🔄 রিফ্রেশ করো</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 ${p.stock<=5?'border-2 border-red-500':''}"><div class="flex justify-between"><b>${p.emoji} ${p.name}</b><div class="flex gap-1"><button onclick="editId=${p.id};render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct(${p.id})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • স্টক: <b>${p.stock}</b></p><div class="flex gap-1 mt-2 flex-wrap">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')||'Kono pic nai'}</div><label class="block mt-2 bg-yellow-50 border border-dashed p-2 rounded-xl text-center cursor-pointer text-sm">📸 Aro Pic Add Koro<input type="file" accept="image/*" multiple class="hidden" onchange="uploadImgs(${p.id},this)"></label><label class="block mt-1 bg-pink-50 border border-dashed p-2 rounded-xl text-center cursor-pointer text-sm">📷 Camera diye Pic Tulo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadImgs(${p.id},this)"></label><div class="mt-3 border-t pt-2"><b class="text-sm">🎨 Variant</b><p class="text-xs">${p.variants&&p.variants.length?p.variants.map(v=>`${v.name} - ৳${v.price}`).join(' | '):'Kono variant nai'}</p><div class="flex gap-1 mt-1"><input id="varName${p.id}" placeholder="L-Red" class="flex-1 border rounded-lg p-1.5 text-sm"><input id="varPrice${p.id}" type="number" placeholder="Dam" class="w-20 border rounded-lg p-1.5 text-sm"><input id="varStock${p.id}" type="number" placeholder="Stock" class="w-16 border rounded-lg p-1.5 text-sm"><button onclick="addVariant(${p.id})" class="bg-gray-900 text-white px-2 rounded-lg">+</button></div></div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><button onclick="saveEdit(${p.id})" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">Save Edit</button></div>`:''}</div>`).join('')}</div>`;}
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); let matchQ=!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||(o.orderId||'').toLowerCase().includes(q); let matchF=orderFilter==='All'||o.status===orderFilter||(orderFilter==='Pending'&&(o.status==='Pending'||o.status==='pending')); return matchQ&&matchF; }); h=`<div class="flex gap-2"><button onclick="refresh().then(render)" class="flex-1 bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><button onclick="exportOrders()" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold">📥 Excel</button></div><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 Nam / Phone / Order ID" class="w-full border rounded-xl p-3 mt-2"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2"><option value="All">সব অর্ডার (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Delivered">🚚 Delivered</option><option value="Rejected">❌ Rejected</option></select><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl ${isFake(o)?'border-2 border-red-500':''}"><b>${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs">${o.status}</span><p class="text-sm">${o.name} | ${o.phone}</p><p class="text-sm">${o.address}</p><p class="text-xs">${o.items}</p><p class="text-xs">💳 ${o.payment||'COD'} ${o.trxId?'| '+o.trxId:''}</p><p class="text-xs text-gray-500">${o.date}</p><div class="flex gap-1 mt-2 flex-wrap">${o.status==='Pending'||o.status==='pending'?`<button onclick="approveOrder('${o.id}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">✅ Approve</button><button onclick="rejectOrder('${o.id}')" class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs">❌ Reject</button>`:''}${o.status==='Approved'||o.status==='approved'?`<button onclick="deliverOrder('${o.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs">🚚 Delivered</button>`:''}<button onclick="printInvoice('${o.id}')" class="bg-yellow-500 px-3 py-1 rounded-full text-xs">🧾 Invoice</button><button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">Delete</button></div></div>`).join(''):'<p class="text-center py-8">Kono order nai</p>'}</div>`;}
if(tab==='faq'){ h=`<div class="bg-white p-3 rounded-xl"><input id="faqQ" placeholder="প্রশ্ন" class="w-full border rounded-lg p-2 mt-2"><input id="faqA" placeholder="উত্তর" class="w-full border rounded-lg p-2 mt-2"><button onclick="addFaq()" class="w-full bg-yellow-500 py-2 rounded-xl font-bold mt-2">Add FAQ</button></div><div class="mt-3 space-y-2">${FAQS.map((f,i)=>`<div class="bg-white p-3 rounded-xl flex justify-between"><div><b class="text-sm">${f.q}</b><p class="text-sm">${f.a}</p></div><button onclick="delFaq(${i})" class="text-red-500">🗑️</button></div>`).join('')}</div>`;}
if(tab==='feedback'){ h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><div class="mt-3 space-y-2">${FEEDBACKS.length?FEEDBACKS.map(f=>`<div class="bg-white p-3 rounded-xl"><b>${f.name}</b><p class="text-sm">${f.text}</p><p class="text-xs">${f.date}</p><button onclick="delFb(${f.id})" class="text-red-500 text-xs">Delete</button></div>`).join(''):'<p class="text-center py-8">Kono feedback nai</p>'}</div>`;}
if(tab==='settings'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4"><h3 class="font-black text-lg">⚙️ Settings</h3><label class="block mt-3">Chat Number</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">যোগাযোগের সময়</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">bKash Number</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3">Admin Password</label><input id="setPass" value="" placeholder="Notun password dile bodlabe" class="w-full border rounded-lg p-2"><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">সেভ</button><button onclick="KEY='';localStorage.removeItem('uniq_admin_key');location.reload()" class="w-full bg-gray-900 text-white py-2 rounded-xl mt-2">বন্ধ</button></div>`;}
document.getElementById('content').innerHTML=h; }
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){alert('Nam + Dam dao');return} let imgs=[...newImgs]; let url=document.getElementById('npImg').value.trim(); if(url) imgs.push(url); if(!imgs.length){ if(!confirm('Pic chara add korba? Pic thakle valo sell hobe. Tao add korbo?')) return; } await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n,cat:document.getElementById('npCat').value,price:pr,old,stock:st,rating:4.8,badge:"New",isNew:true,emoji:document.getElementById('npEmoji').value||'📦',desc:document.getElementById('npDesc').value,highlights:document.getElementById('npHigh').value.split('\n').filter(x=>x.trim()),images:imgs,variants:[]})}); newImgs=[]; await refresh(); render(); alert('✅ Product add hoise - Sob user ekhon dekhte parbe!'); }
async function delProduct(id){ if(!confirm('Delete korba?'))return; await api('/api/admin/products/'+id,{method:'DELETE'}); await refresh(); render(); }
async function saveEdit(id){ await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('eName'+id).value,price:parseInt(document.getElementById('ePrice'+id).value),stock:parseInt(document.getElementById('eStock'+id).value)})}); editId=null; await refresh(); render(); }
async function addVariant(id){ let p=PRODUCTS.find(x=>x.id===id); let n=document.getElementById('varName'+id).value; if(!n){alert('Variant nam dao');return} let vars=[...(p.variants||[]),{name:n,price:parseInt(document.getElementById('varPrice'+id).value||p.price),stock:parseInt(document.getElementById('varStock'+id).value||'0')}]; await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({variants:vars})}); await refresh(); render(); }
async function uploadImgs(id,inp){ let p=PRODUCTS.find(x=>x.id===id); let files=[...inp.files]; let imgs=[...(p.images||[])]; for(let f of files){ let r=new FileReader(); let d=await new Promise(res=>{r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); imgs.push(d); } await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({images:imgs})}); await refresh(); render(); alert('✅ Pic add hoise - Sobai dekhbe'); }
async function delOrder(id){ if(!confirm('Delete?'))return; await api('/api/admin/orders/'+id,{method:'DELETE'}); await refresh(); render(); }
function cleanPhone(p){ let c=(p||'').replace(/[^0-9]/g,''); if(c.startsWith('0')) c='880'+c.slice(1); return c; }
async function approveOrder(id){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Approved'})}); await refresh(); render(); window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent('✅ ORDER CONFIRMED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' APPROVED hoye gese. Total: ৳'+o.total), '_blank'); }
async function rejectOrder(id){ await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Rejected'})}); await refresh(); render(); }
async function deliverOrder(id){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Delivered'})}); await refresh(); render(); window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent('🚚 DELIVERED - UNIQ SHOP\nHello '+o.name+'! Order '+o.orderId+' Delivered'),'_blank'); }
function printInvoice(id){ let o=ORDERS.find(x=>x.id==id); let w=window.open('','_blank'); w.document.write('<h1>UNIQ SHOP - INVOICE</h1><p>Order: '+o.orderId+'<br>'+o.name+' | '+o.phone+'<br>'+o.address+'</p><hr><p>'+o.items+'</p><h3>Total: ৳'+o.total+'</h3>'); }
async function addFaq(){ let q=document.getElementById('faqQ').value, a=document.getElementById('faqA').value; if(!q||!a)return; await api('/api/admin/faqs',{method:'POST',body:JSON.stringify({q,a})}); await refresh(); render(); } async function delFaq(i){ await api('/api/admin/faqs/'+i,{method:'DELETE'}); await refresh(); render(); }
async function delFb(id){ await api('/api/admin/feedbacks/'+id,{method:'DELETE'}); await refresh(); render(); }
async function saveSettings(){ let body={ chatNumber: document.getElementById('setChat').value, contactTime: document.getElementById('setTime').value, bkashNumber: document.getElementById('setBkash').value }; let np=document.getElementById('setPass').value.trim(); if(np){ if(np.length<4){alert('Password 4 okkhor hote hobe');return} body.adminKey=np; } await api('/api/admin/settings',{method:'POST',body:JSON.stringify(body)}); if(np){ KEY=np; localStorage.setItem('uniq_admin_key',np); } alert('✅ Settings Save Hoise!'); location.reload(); }
if(KEY) init();
</script></body></html>
