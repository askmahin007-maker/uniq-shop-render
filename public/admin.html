<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>UNIQ SHOP Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{font-family:"Hind Siliguri",system-ui;box-sizing:border-box}html,body{overflow-x:hidden;max-width:100vw}img{max-width:100%}#tabs{display:flex;flex-wrap:wrap;gap:6px}#tabs button{flex:1 1 auto;min-width:0;white-space:nowrap;font-size:13px;padding:8px 10px}#content{width:100%;overflow-x:hidden}#content input,#content select,#content textarea{max-width:100%;font-size:15px}
@media(max-width:640px){#tabs button{flex:1 1 30%;font-size:12px;padding:8px 4px}.dash-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}.prod-btns{flex-direction:column!important}.prod-btns label{width:100%!important}.price-row{flex-direction:column!important}.price-row>div{width:100%!important}.order-btns{flex-wrap:wrap}.order-btns button{flex:1 1 40%}h1{font-size:20px!important}}
</style></head>
<body class="bg-[#fdf8ec]">
<div class="bg-[#0a3d2e] text-white p-3 sticky top-0 z-50 flex justify-between items-center"><div><h1 class="text-2xl font-black leading-tight">🛠️ UNIQ SHOP অ্যাডমিন</h1><p class="text-xs opacity-80">📱 ফোন থেকেই প্রোডাক্ট যোগ করুন - Supabase Connected ✅</p></div><div class="flex bg-white/20 rounded-full p-0.5 text-xs font-bold shrink-0"><button onclick="setALang('bn')" id="aLangBn" class="px-2.5 py-1.5 rounded-full bg-white text-black">বাংলা</button><button onclick="setALang('en')" id="aLangEn" class="px-2.5 py-1.5 rounded-full">EN</button></div></div>
<div id="loginBox" class="max-w-md mx-auto mt-6 bg-white p-5 rounded-2xl shadow mx-3"><h2 class="text-center font-bold">অ্যাডমিন কী দিয়ে লগইন করুন</h2><p class="text-center text-sm text-gray-500 mt-1">Password: <b>UNIQ123</b></p><input id="adminKeyInput" type="password" placeholder="Admin Key - UNIQ123" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করুন</button></div>
<div id="adminBox" class="hidden p-2 max-w-3xl mx-auto w-full"><div id="tabs" class="w-full"></div><div id="content" class="mt-3 w-full"></div><a href="/" class="block text-center underline mt-4 pb-4">← শপে যান</a></div>
<script>
let ALANG=localStorage.getItem('uniq_admin_lang')||'bn';
function setALang(l){ALANG=l;localStorage.setItem('uniq_admin_lang',l);document.getElementById('aLangBn').className='px-2.5 py-1.5 rounded-full '+(l==='bn'?'bg-white text-black':'');document.getElementById('aLangEn').className='px-2.5 py-1.5 rounded-full '+(l==='en'?'bg-white text-black':'');render();}
const T=(bn,en)=>ALANG==='en'?en:bn;
const SUPABASE_URL="https://uebnghqxhyobynssodck.supabase.co";
const SUPABASE_KEY="sb_publishable_NQWdrjmtrsX0qebqDd_Rgw_EpAmGlkb";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function getAdminPass(){return localStorage.getItem('uniq_admin_custom_pass')||"UNIQ123";}
let PRODUCTS=[], ORDERS=[], tab='dashboard', editId=null, orderSearch='', orderFilter='All', newImgs=[];
let SETTINGS=JSON.parse(localStorage.getItem('uniq_settings')||'{"chatNumber":"01816314494","contactTime":"সকাল ৯টা - রাত ৯টা","bkashNumber":"01816314494"}');
if(localStorage.getItem('uniq_admin')==='yes') init();
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); if(k!==getAdminPass()){alert(T('কী ভুল - পাসওয়ার্ড: ','Wrong Key - Password: ')+getAdminPass());return} localStorage.setItem('uniq_admin','yes'); init(); }
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); setALang(ALANG); }
async function refresh(){
  let {data:p}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  PRODUCTS=(p||[]).map(x=>({id:String(x.id), name:x.name, price:Number(x.price), old:Number(x.old_price||x.price), stock:x.stock??50, cat:x.category||'Fashion', desc:x.description||'', images:x.image_url?[x.image_url]:[]}));
  let {data:o}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  ORDERS=(o||[]).map(x=>({id:String(x.id), orderId:'UNIQ-'+String(x.id).slice(0,6).toUpperCase(), name:x.customer_name, phone:x.customer_phone, address:x.shipping_address, items:x.items, total:x.total_amount, status:x.status||'pending', date:new Date(x.created_at).toLocaleDateString('bn-BD'), payment:x.payment_method||'COD'}));
}
async function handleNewImgs(inp){ let files=[...inp.files]; for(let f of files){ if(f.size>800*1024){alert(T('ছবি অনেক বড়! 800KB এর নিচে ছবি দিন অথবা Image URL ব্যবহার করুন','Image too large! Use image under 800KB or use Image URL')); continue;} let d=await new Promise(res=>{let r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); newImgs.push(d); } renderNewPreview(); }
function renderNewPreview(){ let el=document.getElementById('newPreview'); if(!el) return; el.innerHTML=newImgs.map((im,i)=>`<div class="relative shrink-0"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||`<p class="text-xs text-gray-500">${T('এখনো কোনো ছবি দেওয়া হয়নি','No image added yet')}</p>`; }
function render(){ if(document.getElementById('adminBox').classList.contains('hidden')) return; document.getElementById('tabs').innerHTML=[['dashboard','📊 '+T('ড্যাশবোর্ড','Dashboard')],['products','📦 '+T('পণ্য','Products')],['orders','🧾 '+T('অর্ডার','Orders')],['settings','⚙️ '+T('সেটিংস','Settings')]].map(t=>`<button onclick="tab='${t[0]}';render()" class="rounded-lg font-bold ${tab===t[0]?'bg-[#0a3d2e] text-white':'bg-white border'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let pending=ORDERS.filter(o=>o.status==='pending'||o.status==='Pending'); let totalSale=ORDERS.reduce((s,o)=>s+(parseInt(o.total)||0),0); h=`<div class="bg-green-100 p-3 rounded-2xl"><b class="block">📱 Supabase Connected!</b><p class="text-sm mt-1">${T('প্রোডাক্ট যোগ করলে সাথে সাথে শপে দেখা যাবে','Product will show in Shop instantly')}</p><button onclick="tab='products';render()" class="bg-[#0a3d2e] text-white px-4 py-2 rounded-full font-bold mt-2 w-full sm:w-auto">➕ ${T('এখনই প্রোডাক্ট যোগ করুন →','Add Product Now →')}</button></div><div class="dash-grid grid grid-cols-2 gap-2 mt-3"><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">${T('মোট অর্ডার','Total Orders')}</p><b class="text-2xl">${ORDERS.length} ${T('টা','')}</b></div><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">${T('মোট সেল','Total Sales')}</p><b class="text-2xl break-words">৳${totalSale}</b></div><div class="bg-yellow-100 p-3 rounded-2xl"><p class="text-xs">⏳ Pending</p><b class="text-2xl">${pending.length} ${T('টা','')}</b></div><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">${T('মোট প্রোডাক্ট','Total Products')}</p><b class="text-2xl">${PRODUCTS.length} ${T('টা','')}</b></div></div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">🕐 ${T('সর্বশেষ ৫টি অর্ডার','Latest 5 Orders')}</h3>${ORDERS.slice(0,5).map(o=>`<p class="text-sm border-b py-2 break-words"><b>${o.orderId}</b> - ${o.name} - ৳${o.total} - ${o.status}</p>`).join('')||T('কোনো অর্ডার নেই','No orders')}</div>`; }
if(tab==='products'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-3"><h3 class="font-black text-lg">➕ ${T('নতুন পণ্য যোগ করুন','Add New Product')}</h3><p class="text-xs text-gray-500">${T('সুপাবেসে যাবে - শপে সাথে সাথে দেখা যাবে','Will go to Supabase - Will show in Shop instantly')}</p><input id="npName" placeholder="${T('পণ্যের নাম - যেমন: Winter Stylish Clothes','Product Name - e.g. Winter Stylish Clothes')}" class="w-full border rounded-lg p-3 mt-3"><div class="price-row flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">${T('দাম (৳) *','Price (৳) *')}</label><input id="npPrice" type="number" placeholder="1050" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">${T('আগের দাম','Old Price')}</label><input id="npOld" type="number" placeholder="1500" class="w-full border rounded-lg p-2"></div></div><div class="price-row flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">${T('স্টক','Stock')}</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">${T('ক্যাটাগরি','Category')}</label><select id="npCat" class="w-full border rounded-lg p-2"><option>Summer</option><option>Winter</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Books</option></select></div></div><label class="block text-sm mt-3 font-bold">📸 ${T('প্রোডাক্টের ছবি','Product Image')}</label><div class="prod-btns flex gap-2 mt-2"><label class="flex-1 bg-pink-600 text-white text-center py-3 rounded-xl font-bold cursor-pointer text-sm">📸 ${T('ক্যামেরা দিয়ে তুলুন','Take with Camera')}<input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleNewImgs(this)"></label><label class="flex-1 bg-gray-900 text-white text-center py-3 rounded-xl font-bold cursor-pointer text-sm">🖼️ ${T('গ্যালারি থেকে নিন','Choose from Gallery')}<input type="file" accept="image/*" multiple class="hidden" onchange="handleNewImgs(this)"></label></div><div id="newPreview" class="flex gap-2 flex-wrap mt-3">${newImgs.map((im,i)=>`<div class="relative shrink-0"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||`<p class="text-xs text-gray-500">${T('এখনো কোনো ছবি দেওয়া হয়নি','No image added yet')}</p>`}</div><label class="block text-sm mt-3">${T('ছবির লিংক (চাইলে) - বড় ছবির জন্য এটা ব্যবহার করুন','Image URL (Optional) - Use this for large images')}</label><input id="npImg" placeholder="https://..." class="w-full border rounded-lg p-2"><label class="block text-sm mt-2">${T('বিবরণ','Description')}</label><textarea id="npDesc" placeholder="${T('কাপড়টা কেমন...','How is the product...')}" class="w-full border rounded-lg p-2"></textarea><button onclick="addProduct()" class="w-full bg-yellow-500 py-4 rounded-xl font-black mt-3 text-lg">✅ ${T('পণ্য যোগ করুন - সবাই দেখবে','Add Product - Everyone Will See')}</button></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 border-[#0a3d2e] py-2 rounded-xl font-bold mt-3">🔄 ${T('রিফ্রেশ করুন','Refresh')}</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 overflow-hidden"><div class="flex justify-between gap-2 items-start"><b class="break-words flex-1">📦 ${p.name}</b><div class="flex gap-1 shrink-0"><button onclick="editId='${p.id}';render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct('${p.id}')" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • ${T('স্টক: ','Stock: ')}<b>${p.stock}</b></p><div class="flex gap-1 mt-2 flex-wrap">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')||T('কোনো ছবি নেই','No image')}</div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="price-row flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><button onclick="saveEdit('${p.id}')" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">${T('এডিট সেভ করুন','Save Edit')}</button></div>`:''}</div>`).join('')}</div>`;}
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); return (!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)) && (orderFilter==='All'||o.status===orderFilter||(orderFilter==='Pending'&&(o.status==='pending'||o.status==='Pending'))); }); h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 ${T('রিফ্রেশ','Refresh')}</button><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 ${T('নাম / ফোন','Name / Phone')}" class="w-full border rounded-xl p-3 mt-2"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2"><option value="All">${T('সব অর্ডার','All Orders')} (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Delivered">🚚 Delivered</option></select><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl overflow-hidden"><b class="break-words">${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs whitespace-nowrap">${o.status}</span><p class="text-sm break-words">${o.name} | ${o.phone}</p><p class="text-sm break-words">${o.address}</p><p class="text-xs break-words">${o.items}</p><p class="text-xs text-gray-500">${o.date}</p><div class="order-btns flex gap-1 mt-2"><button onclick="updateOrder('${o.id}','Approved')" class="bg-green-600 text-white px-3 py-2 rounded-full text-xs flex-1">✅ Approve</button><button onclick="updateOrder('${o.id}','Delivered')" class="bg-blue-600 text-white px-3 py-2 rounded-full text-xs flex-1">🚚 Delivered</button><button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-2 rounded-full text-xs flex-1">Delete</button></div></div>`).join(''):`<p class="text-center py-8">${T('কোনো অর্ডার নেই','No orders')}</p>`}</div>`;}
if(tab==='settings'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-3"><h3 class="font-black text-lg">⚙️ ${T('সেটিংস','Settings')}</h3><label class="block mt-3">${T('চ্যাট নম্বর','Chat Number')}</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">${T('যোগাযোগের সময়','Contact Time')}</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">bKash Number</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3 font-bold">🔐 ${T('অ্যাডমিন পাসওয়ার্ড বদলান','Change Admin Password')}</label><input id="setPass" type="password" placeholder="${T('নতুন পাসওয়ার্ড - খালি রাখলে বদলাবে না','New Password - Leave empty if no change')}" class="w-full border rounded-lg p-2"><p class="text-xs text-gray-500 mt-1">${T('পাসওয়ার্ড বদলালে মনে রাখবেন! পরে ওই পাসওয়ার্ড দিয়ে ঢুকতে হবে।','Remember new password! You will need it to login.')}</p><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">${T('সেভ করুন','Save')}</button><button onclick="localStorage.removeItem('uniq_admin');location.reload()" class="w-full bg-gray-900 text-white py-2 rounded-xl mt-2">Logout</button></div>`;}
document.getElementById('content').innerHTML=h; }
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){alert(T('নাম + দাম দিন','Enter Name + Price'));return} let imgs=[...newImgs]; let url=document.getElementById('npImg').value.trim(); if(url) imgs.push(url); let imgUrl=imgs[0]||'https://via.placeholder.com/300'; let {error}=await supabaseClient.from('products').insert([{name:n, price:pr, old_price:old, stock:st, category:document.getElementById('npCat').value, image_url:imgUrl, description:document.getElementById('npDesc').value, is_active:true}]); if(error){alert('❌ '+error.message);return} newImgs=[]; await refresh(); render(); alert('✅ '+T('প্রোডাক্ট যোগ হয়েছে - এখন শপে দেখতে পারবেন!','Product added - You can see it in Shop now!')); }
async function delProduct(id){ if(!confirm(T('ডিলিট করবেন?','Delete?')))return; await supabaseClient.from('products').delete().eq('id',id); await refresh(); render(); }
async function saveEdit(id){ await supabaseClient.from('products').update({name:document.getElementById('eName'+id).value, price:parseInt(document.getElementById('ePrice'+id).value), stock:parseInt(document.getElementById('eStock'+id).value)}).eq('id',id); editId=null; await refresh(); render(); }
async function updateOrder(id,status){ await supabaseClient.from('orders').update({status:status.toLowerCase()}).eq('id',id); await refresh(); render(); }
async function delOrder(id){ if(!confirm('Delete?'))return; await supabaseClient.from('orders').delete().eq('id',id); await refresh(); render(); }
function saveSettings(){ SETTINGS={chatNumber:document.getElementById('setChat').value, contactTime:document.getElementById('setTime').value, bkashNumber:document.getElementById('setBkash').value}; localStorage.setItem('uniq_settings',JSON.stringify(SETTINGS)); let np=document.getElementById('setPass').value.trim(); if(np){ localStorage.setItem('uniq_admin_custom_pass',np); alert('✅ '+T('সেটিংস + পাসওয়ার্ড সেভ হয়েছে! এখন থেকে পাসওয়ার্ড: ','Settings + Password Saved! New Password: ')+np); } else alert('✅ '+T('সেটিংস সেভ হয়েছে!','Settings Saved!')); }
</script></body></html>
