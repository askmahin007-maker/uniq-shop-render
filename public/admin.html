<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniq Shop Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#fdf8ec]">
<div class="bg-[#0a3d2e] text-white p-4"><h1 class="text-2xl font-black">🛠️ Uniq Shop এডমিন প্যানেল</h1></div>
<div id="loginBox" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow"><h2 class="text-center font-bold">এডমিন কী দিয়ে লগইন করো</h2><input id="adminKeyInput" placeholder="Admin key" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করো</button><p class="text-center text-xs mt-2 text-gray-500">Default Key: admin123 - Settings theke change kora jabe</p></div>
<div id="adminBox" class="hidden p-3 max-w-3xl mx-auto"><div class="flex gap-2 overflow-x-auto" id="tabs"></div><div id="content" class="mt-3"></div><a href="/" class="block text-center underline mt-4">← Shop e Jao</a></div>
<script>
let KEY=localStorage.getItem('uniq_admin_key')||'', PRODUCTS=[], ORDERS=[], FEEDBACKS=[], FAQS=[], SETTINGS={}, tab='dashboard', editId=null, orderSearch='', orderFilter='All';
async function api(url, opt={}){ opt.headers={...(opt.headers||{}), 'x-admin-key':KEY, 'Content-Type':'application/json'}; let r=await fetch(url,opt); if(r.status===401){ alert('Admin Key vul'); throw new Error('auth'); } return r.json(); }
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); let r=await fetch('/api/check-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}); let j=await r.json(); if(!j.ok){alert('Key vul');return} KEY=k; localStorage.setItem('uniq_admin_key',k); init(); }
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); }
async function refresh(){ PRODUCTS=await fetch('/api/products').then(r=>r.json()); ORDERS=await api('/api/admin/orders'); FEEDBACKS=await api('/api/admin/feedbacks'); FAQS=await fetch('/api/faqs').then(r=>r.json()); SETTINGS=await fetch('/api/settings').then(r=>r.json()); }
function cleanPhone2(p){ return (p||'').replace(/[^0-9]/g,''); }
function parseDate(d){ if(!d) return new Date(0); if(typeof d==='number') return new Date(d); let m=String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(m[3], m[2]-1, m[1]); return new Date(d); }
function isFake(o){ let ph=cleanPhone2(o.phone); let today=new Date().toDateString(); let c=ORDERS.filter(x=>cleanPhone2(x.phone)===ph && (x.status==='Pending'||x.status==='pending') && parseDate(x.date).toDateString()===today).length; return c>=3; }
function exportOrders(){ let rows=[['OrderID','Name','Phone','Address','Items','Total','Status','Date','Payment','TrxID']]; ORDERS.forEach(o=>rows.push([o.orderId,o.name,o.phone,(o.address||'').replace(/,/g,' '),(o.items||'').replace(/,/g,' '),o.total,o.status,o.date,o.payment||'COD',o.trxId||''])); let csv=rows.map(r=>r.join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='uniq-orders.csv'; a.click(); }
function render(){ document.getElementById('tabs').innerHTML=[['dashboard','📊 Dashboard'],['products','পণ্য'],['orders','অর্ডার'],['faq','প্রশ্নোত্তর'],['feedback','Feedback'],['settings','Settings']].map(t=>`<button onclick="tab='${t[0]}';render()" class="whitespace-nowrap px-4 py-2 rounded-lg font-bold ${tab===t[0]?'bg-[#0a3d2e] text-white':'bg-white border'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let today=new Date().toDateString(); let todayOrders=ORDERS.filter(o=>parseDate(o.date).toDateString()===today); let pending=ORDERS.filter(o=>o.status==='Pending'||o.status==='pending'); let totalSale=ORDERS.filter(o=>o.status!=='Rejected').reduce((s,o)=>s+(parseInt(o.total)||0),0); let low=PRODUCTS.filter(p=>p.stock<=5); h=`<div class="grid grid-cols-2 gap-2"><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">আজকের অর্ডার</p><b class="text-2xl">${todayOrders.length} টা</b></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">মোট সেল (Rejected বাদে)</p><b class="text-2xl">৳${totalSale}</b></div><div class="bg-yellow-100 p-4 rounded-2xl"><p class="text-xs">⏳ Pending</p><b class="text-2xl">${pending.length} টা</b><br><button onclick="tab='orders';orderFilter='Pending';render()" class="text-xs underline">Pending দেখো →</button></div><div class="bg-white p-4 rounded-2xl"><p class="text-xs text-gray-500">মোট প্রোডাক্ট</p><b class="text-2xl">${PRODUCTS.length} টা</b></div></div><div class="bg-red-50 border border-red-200 p-3 rounded-2xl mt-3"><h3 class="font-black text-red-600">📦 Low Stock Alert (5 বা কম)</h3>${low.length?low.map(p=>`<p class="text-sm">⚠️ ${p.emoji} ${p.name} - Stock: <b>${p.stock}</b> <button onclick="tab='products';render()" class="underline text-xs">Edit</button></p>`).join(''):'<p class="text-sm">✅ সব প্রোডাক্টে স্টক ঠিক আছে</p>'}</div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">🕐 সর্বশেষ 5 টা অর্ডার</h3>${ORDERS.slice(-5).reverse().map(o=>`<p class="text-sm border-b py-1"><b>${o.orderId}</b> - ${o.name} - ৳${o.total} - ${o.status} ${isFake(o)?'<span class="text-red-600 font-bold">⚠️ FAKE SUSPECT</span>':''}</p>`).join('')||'কোনো অর্ডার নাই'}</div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">💬 সর্বশেষ Feedback</h3>${FEEDBACKS.slice(-3).reverse().map(f=>`<p class="text-sm border-b py-1"><b>${f.name}:</b> ${f.text}</p>`).join('')||'কোনো ফিডব্যাক নাই'}</div>`; }
if(tab==='products'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4"><h3 class="font-black text-lg">➕ নতুন পণ্য যোগ করো</h3><input id="npName" placeholder="পণ্যের নাম" class="w-full border rounded-lg p-2 mt-2"><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">মূল দাম (৳)</label><input id="npPrice" type="number" placeholder="৭৯৯" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ছাড়ের দাম</label><input id="npOld" type="number" placeholder="৭৯৯" class="w-full border rounded-lg p-2"></div></div><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">স্টক</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ক্যাটাগরি</label><select id="npCat" class="w-full border rounded-lg p-2"><option>Summer</option><option>Winter</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Books</option></select></div></div><label class="block text-sm mt-2">ইমোজি</label><input id="npEmoji" value="📦" class="w-full border rounded-lg p-2"><label class="block text-sm mt-2">বিবরণ</label><textarea id="npDesc" placeholder="সংক্ষিপ্ত বিবরণ" class="w-full border rounded-lg p-2"></textarea><label class="block text-sm mt-2">Highlights (প্রতি লাইনে একটি)</label><textarea id="npHigh" placeholder="১০০% অরিজিনাল পণ্য&#10;৭ দিনের রিটার্ন সুবিধা" class="w-full border rounded-lg p-2"></textarea><label class="block text-sm mt-2">Image URL</label><input id="npImg" placeholder="https://..." class="w-full border rounded-lg p-2"><button onclick="addProduct()" class="w-full bg-yellow-500 py-3 rounded-xl font-black mt-3">পণ্য যোগ করো</button></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 border-[#0a3d2e] py-2 rounded-xl font-bold mt-3">🔄 রিফ্রেশ করো</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 ${p.stock<=5?'border-2 border-red-500':''}"><div class="flex justify-between"><b>${p.emoji} ${p.name} ${p.stock<=5?'<span class="bg-red-500 text-white text-xs px-2 rounded-full">LOW STOCK!</span>':''}</b><div class="flex gap-1"><button onclick="editId=${p.id};render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct(${p.id})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • স্টক: <b class="${p.stock<=5?'text-red-600':''}">${p.stock}</b></p><p class="text-sm">${p.images&&p.images.length?p.images.length+' ta chobi':'এখনো কোনো ছবি নেই'}</p><label class="block mt-2 bg-yellow-50 border border-dashed p-2 rounded-xl text-center cursor-pointer">📷 ছবি যোগ করো (একাধিক)<input type="file" accept="image/*" multiple class="hidden" onchange="uploadImgs(${p.id},this)"></label><div class="flex gap-1 mt-2 flex-wrap">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')}</div><div class="mt-3 border-t pt-2"><b class="text-sm">🎨 রঙ/সাইজ অপশন (ভ্যারিয়েন্ট)</b><p class="text-xs text-gray-500">${p.variants&&p.variants.length?p.variants.map(v=>`${v.name} - ৳${v.price} - Stock ${v.stock}`).join(' | '):'কোনো ভ্যারিয়েন্ট নেই'}</p><div class="flex gap-1 mt-1"><input id="varName${p.id}" placeholder="যেমন: L-Red" class="flex-1 border rounded-lg p-1.5 text-sm"><input id="varPrice${p.id}" type="number" placeholder="দাম" class="w-20 border rounded-lg p-1.5 text-sm"><input id="varStock${p.id}" type="number" placeholder="স্টক" class="w-16 border rounded-lg p-1.5 text-sm"><button onclick="addVariant(${p.id})" class="bg-gray-900 text-white px-2 rounded-lg">+</button></div></div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><button onclick="saveEdit(${p.id})" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">Save Edit</button></div>`:''}</div>`).join('')}</div>`;}
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); let matchQ=!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||(o.orderId||'').toLowerCase().includes(q); let matchF=orderFilter==='All'||o.status===orderFilter||(orderFilter==='Pending'&&(o.status==='Pending'||o.status==='pending')); return matchQ&&matchF; }); h=`<div class="flex gap-2"><button onclick="refresh().then(render)" class="flex-1 bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><button onclick="exportOrders()" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold">📥 Excel Download</button></div><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 Nam / Phone / Order ID diye khujo..." class="w-full border rounded-xl p-3 mt-2"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2"><option value="All">সব অর্ডার (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Delivered">🚚 Delivered</option><option value="Rejected">❌ Rejected</option></select><p class="text-xs mt-1">দেখাচ্ছে: ${list.length} টা</p><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl ${isFake(o)?'border-2 border-red-500':''}"><b>${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs">${o.status}</span> ${isFake(o)?'<span class="bg-red-500 text-white px-2 rounded-full text-xs">⚠️ FAKE SUSPECT - 1 দিনে 3+ Pending</span>':''}<p class="text-sm">${o.name} | ${o.phone}</p><p class="text-sm">${o.address}</p><p class="text-xs">${o.items}</p><p class="text-xs">💳 ${o.payment||'COD'} ${o.trxId?'| TrxID: '+o.trxId:''}</p><p class="text-xs text-gray-500">${o.date}</p><div class="flex gap-1 mt-2 flex-wrap">${o.status==='Pending'||o.status==='pending'?`<button onclick="approveOrder('${o.id}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">✅ Approve & WhatsApp</button><button onclick="rejectOrder('${o.id}')" class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs">❌ Reject</button>`:''}${o.status==='Confirm'||o.status==='Approved'||o.status==='approved'?`<button onclick="deliverOrder('${o.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs">🚚 Delivered & WhatsApp</button>`:''}<button onclick="printInvoice('${o.id}')" class="bg-yellow-500 px-3 py-1 rounded-full text-xs">🧾 Invoice</button><button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">Delete</button></div></div>`).join(''):'<p class="text-center py-8">কোনো অর্ডার পাওয়া যায়নি</p>'}</div>`;}
if(tab==='faq'){ h=`<div class="bg-white p-3 rounded-xl"><h3 class="font-black">➕ নতুন প্রশ্নোত্তর</h3><input id="faqQ" placeholder="প্রশ্ন" class="w-full border rounded-lg p-2 mt-2"><input id="faqA" placeholder="উত্তর" class="w-full border rounded-lg p-2 mt-2"><button onclick="addFaq()" class="w-full bg-yellow-500 py-2 rounded-xl font-bold mt-2">Add FAQ</button></div><div class="mt-3 space-y-2">${FAQS.map((f,i)=>`<div class="bg-white p-3 rounded-xl flex justify-between"><div><b class="text-sm">${f.q}</b><p class="text-sm">${f.a}</p></div><button onclick="delFaq(${i})" class="text-red-500">🗑️</button></div>`).join('')}</div>`;}
if(tab==='feedback'){ h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ করো</button><div class="mt-3 space-y-2">${FEEDBACKS.length?FEEDBACKS.map(f=>`<div class="bg-white p-3 rounded-xl"><b>${f.name}</b> ${f.verified?'<span class="bg-green-100 text-green-700 text-xs px-2 rounded-full">✅ Verified Buyer</span>':''} <span class="text-yellow-500">${'⭐'.repeat(f.rating||5)}</span><p class="text-sm">${f.text}</p>${f.img?`<img src="${f.img}" class="w-20 h-20 object-cover rounded-lg mt-1">`:''}<p class="text-xs text-gray-500">${f.date} | ${f.product||''}</p><button onclick="delFb(${f.id})" class="text-red-500 text-xs">Delete</button></div>`).join(''):'<p class="text-center py-8">এখনো কোনো ফিডব্যাক আসেনি</p>'}</div>`;}
if(tab==='settings'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4"><h3 class="font-black text-lg">⚙️ Settings</h3><p class="text-sm text-gray-500">এখানে বদলালে সাথে সাথে পুরো সাইটে দেখাবে।</p><label class="block mt-3">Chat Number</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">যোগাযোগের সময়</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">bKash Number (Payment)</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3">Admin Password</label><input id="setPass" value="" placeholder="নতুন Password দিলে বদলাবে, খালি রাখলে আগেরটাই থাকবে" class="w-full border rounded-lg p-2"><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">সেভ</button><button onclick="KEY='';localStorage.removeItem('uniq_admin_key');location.reload()" class="w-full bg-gray-900 text-white py-2 rounded-xl mt-2">বন্ধ</button></div>`;}
document.getElementById('content').innerHTML=h; }
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){alert('Nam + Dam dao');return} await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n,cat:document.getElementById('npCat').value,price:pr,old,stock:st,rating:4.8,badge:"New",isNew:true,emoji:document.getElementById('npEmoji').value||'📦',desc:document.getElementById('npDesc').value,highlights:document.getElementById('npHigh').value.split('\n').filter(x=>x.trim()),images:document.getElementById('npImg').value?[document.getElementById('npImg').value]:[],variants:[]})}); await refresh(); render(); alert('✅ Product add hoise'); }
async function delProduct(id){ if(!confirm('Delete korba?'))return; await api('/api/admin/products/'+id,{method:'DELETE'}); await refresh(); render(); }
async function saveEdit(id){ await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('eName'+id).value,price:parseInt(document.getElementById('ePrice'+id).value),stock:parseInt(document.getElementById('eStock'+id).value)})}); editId=null; await refresh(); render(); }
async function addVariant(id){ let p=PRODUCTS.find(x=>x.id===id); let n=document.getElementById('varName'+id).value; if(!n){alert('Variant nam dao');return} let vars=[...(p.variants||[]),{name:n,price:parseInt(document.getElementById('varPrice'+id).value||p.price),stock:parseInt(document.getElementById('varStock'+id).value||'0')}]; await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({variants:vars})}); await refresh(); render(); }
async function uploadImgs(id,inp){ let p=PRODUCTS.find(x=>x.id===id); let files=[...inp.files]; let imgs=[...(p.images||[])]; for(let f of files){ let r=new FileReader(); let d=await new Promise(res=>{r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); imgs.push(d); } await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({images:imgs})}); await refresh(); render(); alert('✅ Chobi add hoise'); }
async function setOrder(id,s){ await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:s})}); await refresh(); render(); } async function delOrder(id){ if(!confirm('Delete?'))return; await api('/api/admin/orders/'+id,{method:'DELETE'}); await refresh(); render(); }
function cleanPhone(p){ let c=(p||'').replace(/[^0-9]/g,''); if(c.startsWith('0')) c='880'+c.slice(1); return c; }
async function approveOrder(id){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Approved'})}); await refresh(); render(); window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent('✅ ORDER CONFIRMED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' APPROVED hoye gese. Total: ৳'+o.total+'\n2-3 diner moddhe peye jaba In Sha Allah. Dhonnobad! ❤️'),'_blank'); }
async function rejectOrder(id){ await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Rejected'})}); await refresh(); render(); }
async function deliverOrder(id){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:'Delivered'})}); await refresh(); render(); window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent('🚚 DELIVERED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' Delivered hoye gese. Peye gele janaba. Dhonnobad! ❤️'),'_blank'); }
function printInvoice(id){ let o=ORDERS.find(x=>x.id==id); let w=window.open('','_blank'); w.document.write('<h1>UNIQ SHOP - INVOICE</h1><p>Order: '+o.orderId+'<br>'+o.name+' | '+o.phone+'<br>'+o.address+'</p><hr><p>'+o.items+'</p><h3>Total: ৳'+o.total+'</h3><p>Payment: '+(o.payment||'COD')+' '+(o.trxId||'')+'</p><p>WhatsApp: 01816314494</p><button onclick="window.print()">Print</button>'); }
async function addFaq(){ let q=document.getElementById('faqQ').value, a=document.getElementById('faqA').value; if(!q||!a)return; await api('/api/admin/faqs',{method:'POST',body:JSON.stringify({q,a})}); await refresh(); render(); } async function delFaq(i){ await api('/api/admin/faqs/'+i,{method:'DELETE'}); await refresh(); render(); }
async function delFb(id){ await api('/api/admin/feedbacks/'+id,{method:'DELETE'}); await refresh(); render(); }
async function saveSettings(){ let body={ chatNumber: document.getElementById('setChat').value, contactTime: document.getElementById('setTime').value, bkashNumber: document.getElementById('setBkash').value }; let np=document.getElementById('setPass').value.trim(); if(np){ if(np.length<4){alert('Password kompokkhe 4 okkhor hote hobe');return} body.adminKey=np; } await api('/api/admin/settings',{method:'POST',body:JSON.stringify(body)}); if(np){ KEY=np; localStorage.setItem('uniq_admin_key',np); alert('✅ Settings + Password Bodle Gese!'); } else alert('✅ Settings Save Hoise!'); location.reload(); }
if(KEY) init();
</script></body></html>
