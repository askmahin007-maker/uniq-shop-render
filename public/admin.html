<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Uniq Shop Admin - Supabase</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100vw}
img{max-width:100%}
#tabs{display:flex;flex-wrap:wrap;gap:6px}
#tabs button{flex:1 1 auto;min-width:0;white-space:nowrap;font-size:13px;padding:8px 10px}
#content{width:100%;overflow-x:hidden}
#content input,#content select,#content textarea{max-width:100%;font-size:15px}
#content .flex{gap:6px}
@media(max-width:640px){
  #tabs button{flex:1 1 30%;font-size:12px;padding:8px 4px}
  .dash-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .dash-grid b{font-size:18px!important}
  .prod-btns{flex-direction:column!important}
  .prod-btns label{width:100%!important}
  .price-row{flex-direction:column!important}
  .price-row>div{width:100%!important}
  .order-btns{flex-wrap:wrap}
  .order-btns button{flex:1 1 40%}
  h1{font-size:20px!important}
  .max-w-3xl{padding-left:8px!important;padding-right:8px!important}
}
</style>
</head>
<body class="bg-[#fdf8ec]">
<div class="bg-[#0a3d2e] text-white p-3 sticky top-0 z-50"><h1 class="text-2xl font-black leading-tight">🛠️ Uniq Shop এডমিন</h1><p class="text-xs opacity-80">📱 Phone thekei Product Add - Supabase Connected ✅</p></div>
<div id="loginBox" class="max-w-md mx-auto mt-6 bg-white p-5 rounded-2xl shadow mx-3"><h2 class="text-center font-bold">এডমিন কী দিয়ে লগইন করো</h2><p class="text-center text-sm text-gray-500 mt-1">Password: <b>UNIQ123</b></p><input id="adminKeyInput" type="password" placeholder="Admin key - UNIQ123" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করো</button></div>
<div id="adminBox" class="hidden p-2 max-w-3xl mx-auto w-full"><div id="tabs" class="w-full"></div><div id="content" class="mt-3 w-full"></div><a href="/" class="block text-center underline mt-4 pb-4">← Shop e Jao</a></div>
<script>
const SUPABASE_URL="https://uebnghqxhyobynssodck.supabase.co";
const SUPABASE_KEY="sb_publishable_NQWdrjmtrsX0qebqDd_Rgw_EpAmGlkb";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_PASS="UNIQ123";
let PRODUCTS=[], ORDERS=[], tab='dashboard', editId=null, orderSearch='', orderFilter='All', newImgs=[];
let SETTINGS=JSON.parse(localStorage.getItem('uniq_settings')||'{"chatNumber":"01816314494","contactTime":"সকাল ৯টা - রাত ৯টা","bkashNumber":"01816314494"}');
if(localStorage.getItem('uniq_admin')==='yes') init();
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); if(k!==ADMIN_PASS){alert('Key vul - Password: UNIQ123');return} localStorage.setItem('uniq_admin','yes'); init(); }
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); }
async function refresh(){
  let {data:p}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  PRODUCTS=(p||[]).map(x=>({id:String(x.id), name:x.name, price:Number(x.price), old:Number(x.old_price||x.price), stock:x.stock??50, cat:x.category||'Fashion', emoji:'📦', rating:4.8, badge:'', desc:x.description||'', images:x.image_url?[x.image_url]:[], variants:[]}));
  let {data:o}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  ORDERS=(o||[]).map(x=>({id:String(x.id), orderId:'UNIQ-'+String(x.id).slice(0,6).toUpperCase(), name:x.customer_name, phone:x.customer_phone, address:x.shipping_address, items:x.items, total:x.total_amount, status:x.status||'pending', date:new Date(x.created_at).toLocaleDateString('bn-BD'), payment:x.payment_method||'COD', trxId:''}));
}
async function handleNewImgs(inp){ let files=[...inp.files]; for(let f of files){ let d=await new Promise(res=>{let r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); newImgs.push(d); } renderNewPreview(); }
function renderNewPreview(){ let el=document.getElementById('newPreview'); if(!el) return; el.innerHTML=newImgs.map((im,i)=>`<div class="relative shrink-0"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'; }
function render(){ document.getElementById('tabs').innerHTML=[['dashboard','📊 Dashboard'],['products','📦 পণ্য'],['orders','🧾 অর্ডার'],['settings','⚙️ Settings']].map(t=>`<button onclick="tab='${t[0]}';render()" class="rounded-lg font-bold ${tab===t[0]?'bg-[#0a3d2e] text-white':'bg-white border'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let pending=ORDERS.filter(o=>o.status==='pending'||o.status==='Pending'); let totalSale=ORDERS.reduce((s,o)=>s+(parseInt(o.total)||0),0); h=`<div class="bg-green-100 p-3 rounded-2xl"><b class="block">📱 Supabase Connected!</b><p class="text-sm mt-1">Product Add korle sathe sathe Shop e jabe</p><button onclick="tab='products';render()" class="bg-[#0a3d2e] text-white px-4 py-2 rounded-full font-bold mt-2 w-full sm:w-auto">➕ Ekhoni Product Add Koro →</button></div><div class="dash-grid grid grid-cols-2 gap-2 mt-3"><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">মোট অর্ডার</p><b class="text-2xl">${ORDERS.length} টা</b></div><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">মোট সেল</p><b class="text-2xl break-words">৳${totalSale}</b></div><div class="bg-yellow-100 p-3 rounded-2xl"><p class="text-xs">⏳ Pending</p><b class="text-2xl">${pending.length} টা</b></div><div class="bg-white p-3 rounded-2xl"><p class="text-xs text-gray-500">মোট প্রোডাক্ট</p><b class="text-2xl">${PRODUCTS.length} টা</b></div></div><div class="bg-white p-3 rounded-2xl mt-3"><h3 class="font-black">🕐 সর্বশেষ 5 টা অর্ডার</h3>${ORDERS.slice(0,5).map(o=>`<p class="text-sm border-b py-2 break-words"><b>${o.orderId}</b> - ${o.name} - ৳${o.total} - ${o.status}</p>`).join('')||'Kono order nai'}</div>`; }
if(tab==='products'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-3"><h3 class="font-black text-lg">➕ নতুন পণ্য যোগ করো</h3><p class="text-xs text-gray-500">Supabase e jabe - Shop e sathe sathe dekhbe</p><input id="npName" placeholder="পণ্যের নাম - jemon: winter stylish clothes" class="w-full border rounded-lg p-3 mt-3"><div class="price-row flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">দাম (৳) *</label><input id="npPrice" type="number" placeholder="1050" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">আগের দাম</label><input id="npOld" type="number" placeholder="1500" class="w-full border rounded-lg p-2"></div></div><div class="price-row flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">স্টক</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ক্যাটাগরি</label><select id="npCat" class="w-full border rounded-lg p-2"><option>Summer</option><option>Winter</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Books</option></select></div></div><label class="block text-sm mt-3 font-bold">📸 Product er Pic</label><div class="prod-btns flex gap-2 mt-2"><label class="flex-1 bg-pink-600 text-white text-center py-3 rounded-xl font-bold cursor-pointer text-sm">📸 Camera diye Tulo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleNewImgs(this)"></label><label class="flex-1 bg-gray-900 text-white text-center py-3 rounded-xl font-bold cursor-pointer text-sm">🖼️ Gallery theke Nao<input type="file" accept="image/*" multiple class="hidden" onchange="handleNewImgs(this)"></label></div><div id="newPreview" class="flex gap-2 flex-wrap mt-3">${newImgs.map((im,i)=>`<div class="relative shrink-0"><img src="${im}" class="w-20 h-20 object-cover rounded-xl border-2"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'}</div><label class="block text-sm mt-3">Image URL (Chaile link)</label><input id="npImg" placeholder="https://..." class="w-full border rounded-lg p-2"><label class="block text-sm mt-2">বিবরণ</label><textarea id="npDesc" placeholder="Kapor ta kemon..." class="w-full border rounded-lg p-2"></textarea><button onclick="addProduct()" class="w-full bg-yellow-500 py-4 rounded-xl font-black mt-3 text-lg">✅ পণ্য যোগ করো - Sobai Dekhbe</button></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 border-[#0a3d2e] py-2 rounded-xl font-bold mt-3">🔄 রিফ্রেশ করো</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 overflow-hidden"><div class="flex justify-between gap-2 items-start"><b class="break-words flex-1">📦 ${p.name}</b><div class="flex gap-1 shrink-0"><button onclick="editId='${p.id}';render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct('${p.id}')" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • স্টক: <b>${p.stock}</b></p><div class="flex gap-1 mt-2 flex-wrap">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')||'Kono pic nai'}</div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="price-row flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><button onclick="saveEdit('${p.id}')" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">Save Edit</button></div>`:''}</div>`).join('')}</div>`;}
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); return (!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)) && (orderFilter==='All'||o.status===orderFilter||(orderFilter==='Pending'&&(o.status==='pending'||o.status==='Pending'))); }); h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 Nam / Phone" class="w-full border rounded-xl p-3 mt-2"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2"><option value="All">সব অর্ডার (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Delivered">🚚 Delivered</option></select><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl overflow-hidden"><b class="break-words">${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs whitespace-nowrap">${o.status}</span><p class="text-sm break-words">${o.name} | ${o.phone}</p><p class="text-sm break-words">${o.address}</p><p class="text-xs break-words">${o.items}</p><p class="text-xs text-gray-500">${o.date}</p><div class="order-btns flex gap-1 mt-2"><button onclick="updateOrder('${o.id}','Approved')" class="bg-green-600 text-white px-3 py-2 rounded-full text-xs flex-1">✅ Approve</button><button onclick="updateOrder('${o.id}','Delivered')" class="bg-blue-600 text-white px-3 py-2 rounded-full text-xs flex-1">🚚 Delivered</button><button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-2 rounded-full text-xs flex-1">Delete</button></div></div>`).join(''):'<p class="text-center py-8">Kono order nai</p>'}</div>`;}
if(tab==='settings'){ h=`<div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-3"><h3 class="font-black text-lg">⚙️ Settings</h3><label class="block mt-3">Chat Number</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">যোগাযোগের সময়</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3">bKash Number</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3 font-bold">🔐 Admin Password Bodlao</label><input id="setPass" type="password" placeholder="Notun Password - Khali rakhle bodlabe na" class="w-full border rounded-lg p-2"><p class="text-xs text-gray-500 mt-1">Password bodlale mone rakho! Pore oi Password diye dhukte hobe. Code e giyeo bodlate parba.</p><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">সেভ</button><button onclick="localStorage.removeItem('uniq_admin');location.reload()" class="w-full bg-gray-900 text-white py-2 rounded-xl mt-2">Logout</button></div>`;}
document.getElementById('content').innerHTML=h; }
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){alert('Nam + Dam dao');return} let imgs=[...newImgs]; let url=document.getElementById('npImg').value.trim(); if(url) imgs.push(url); let imgUrl=imgs[0]||'https://via.placeholder.com/300'; let {error}=await supabaseClient.from('products').insert([{name:n, price:pr, old_price:old, stock:st, category:document.getElementById('npCat').value, image_url:imgUrl, description:document.getElementById('npDesc').value, is_active:true}]); if(error){alert('❌ '+error.message);return} newImgs=[]; await refresh(); render(); alert('✅ Product add hoise - Ekhon Shop e dekhte parba!'); }
async function delProduct(id){ if(!confirm('Delete korba?'))return; await supabaseClient.from('products').delete().eq('id',id); await refresh(); render(); }
async function saveEdit(id){ await supabaseClient.from('products').update({name:document.getElementById('eName'+id).value, price:parseInt(document.getElementById('ePrice'+id).value), stock:parseInt(document.getElementById('eStock'+id).value)}).eq('id',id); editId=null; await refresh(); render(); }
async function updateOrder(id,status){ await supabaseClient.from('orders').update({status:status.toLowerCase()}).eq('id',id); await refresh(); render(); }
async function delOrder(id){ if(!confirm('Delete?'))return; await supabaseClient.from('orders').delete().eq('id',id); await refresh(); render(); }
function saveSettings(){ SETTINGS={chatNumber:document.getElementById('setChat').value, contactTime:document.getElementById('setTime').value, bkashNumber:document.getElementById('setBkash').value}; localStorage.setItem('uniq_settings',JSON.stringify(SETTINGS)); let np=document.getElementById('setPass').value.trim(); if(np){ localStorage.setItem('uniq_admin_custom_pass',np); alert('✅ Settings + Password Save Hoise! Ekhon theke Password: '+np); } else alert('✅ Settings Save Hoise!'); }
</script></body></html>
