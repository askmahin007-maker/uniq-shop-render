<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQ SHOP Admin - Advance</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{font-family:'Hind Siliguri',system-ui}input,select,textarea{outline:none}input:focus{border-color:#0a3d2e!important}.tab-active{background:#0a3d2e!important;color:#fff!important}.toast{animation:s .3s}@keyframes s{from{transform:translateY(10px);opacity:0}}</style></head>
<body class="bg-[#fdf8ec] pb-24">
<div class="bg-[#0a3d2e] text-white p-4 sticky top-0 z-50"><h1 class="text-2xl font-black">🛠️ UNIQ SHOP এডমিন</h1><p class="text-xs opacity-80">সব কিছু এখান থেকে কাস্টমাইজ করো - কোডে হাত দিতে হবে না • Advance Version</p></div>
<div id="loginBox" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow"><h2 class="text-center font-bold text-lg">এডমিন কী দিয়ে লগইন করো</h2><p class="text-center text-xs text-gray-500 mt-1">Secure Admin Key • Default: admin123</p><input id="adminKeyInput" placeholder="Admin key" class="w-full border rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-[#0a3d2e] text-white py-3 rounded-xl font-bold mt-3">প্রবেশ করো →</button><a href="/" class="block text-center underline text-sm mt-3">← Shop e Jao</a></div>
<div id="adminBox" class="hidden p-3 max-w-[1200px] mx-auto"><div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm"><div><b id="shopNameTitle" class="text-lg">UNIQ SHOP</b> <span class="text-xs text-gray-500">• Admin Panel</span></div><div class="flex gap-2"><a href="/" class="bg-gray-100 px-3 py-2 rounded-full text-sm font-bold">← Shop e Jao</a><button onclick="doLogout()" class="bg-red-100 text-red-600 px-3 py-2 rounded-full text-sm font-bold">Logout</button></div></div><div class="flex gap-2 overflow-x-auto mt-3 pb-1" id="tabs"></div><div id="content" class="mt-3"></div></div>
<div id="toastWrap" class="fixed top-20 right-3 z-[100] space-y-2"></div>
<script>
let KEY=localStorage.getItem('uniq_admin_key')||'', PRODUCTS=[], ORDERS=[], FEEDBACKS=[], FAQS=[], SETTINGS={}, COUPONS=[], CATS=['সব','Summer','Winter','Electronics','Fashion','Home','Books','Beauty'], tab='dashboard', editId=null, orderSearch='', orderFilter='All', newImgs=[], newVariants=[];
function toast(m){let d=document.createElement('div');d.className='toast bg-gray-900 text-white px-4 py-3 rounded-2xl shadow text-sm font-bold';d.textContent=m;document.getElementById('toastWrap').appendChild(d);setTimeout(()=>d.remove(),2500)}
async function api(url, opt={}){ opt.headers={...(opt.headers||{}), 'x-admin-key':KEY, 'Content-Type':'application/json'}; let r=await fetch(url,opt); if(r.status===401){ alert('Admin Key vul'); throw new Error('auth'); } return r.json(); }
async function login(){ let k=document.getElementById('adminKeyInput').value.trim(); if(!k){toast('Key dao');return} let r=await fetch('/api/check-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}); let j=await r.json(); if(!j.ok){toast('❌ Key vul');return} KEY=k; localStorage.setItem('uniq_admin_key',k); init(); }
function doLogout(){localStorage.removeItem('uniq_admin_key');location.reload()}
async function init(){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('adminBox').classList.remove('hidden'); await refresh(); render(); }
async function refresh(){ try{PRODUCTS=await fetch('/api/products').then(r=>r.json());}catch(e){} try{ORDERS=await api('/api/admin/orders');}catch(e){} try{FEEDBACKS=await api('/api/admin/feedbacks');}catch(e){} try{FAQS=await fetch('/api/faqs').then(r=>r.json());}catch(e){} try{SETTINGS=await fetch('/api/settings').then(r=>r.json());}catch(e){} COUPONS=SETTINGS.coupons||[{code:'UNIQ10',off:10,active:true}]; if(SETTINGS.cats) CATS=SETTINGS.cats; if(SETTINGS.theme) applyThemePreview(SETTINGS.theme); document.getElementById('shopNameTitle').textContent=SETTINGS.shopName||'UNIQ SHOP'; }
function applyThemePreview(th){document.documentElement.style.setProperty('--primary',th.primary||'#0a3d2e')}
function addVariantRow(){ newVariants.push({color:'', size:'M', stock:10}); renderVariants(); }
function renderVariants(){
  let el=document.getElementById('variantList'); if(!el) return;
  el.innerHTML = newVariants.map((v,i)=>`<div class="flex gap-1 bg-white p-2 rounded-lg items-center flex-wrap"><input value="${v.color}" oninput="newVariants[${i}].color=this.value" placeholder="Color - White" class="flex-1 min-w-[100px] border rounded p-2"><select onchange="newVariants[${i}].size=this.value" class="border rounded p-2"><option ${v.size=='S'?'selected':''}>S</option><option ${v.size=='M'?'selected':''}>M</option><option ${v.size=='L'?'selected':''}>L</option><option ${v.size=='XL'?'selected':''}>XL</option><option ${v.size=='XXL'?'selected':''}>XXL</option><option ${v.size=='One Size'?'selected':''}>One Size</option><option ${v.size=='Free'?'selected':''}>Free</option><option ${v.size=='Set'?'selected':''}>Set</option></select><input type="number" value="${v.stock}" oninput="newVariants[${i}].stock=this.value" placeholder="Stock" class="w-20 border rounded p-2"><button onclick="newVariants.splice(${i},1);renderVariants()" class="bg-red-500 text-white px-2 rounded">✕</button></div>`).join('') || '<p class="text-xs text-gray-500">Kono variant nai - tahole Default stock cholbe</p>';
  let tot = newVariants.reduce((s,v)=>s+(parseInt(v.stock)||0),0);
  let totEl=document.getElementById('variantTotal'); if(totEl) totEl.textContent = newVariants.length ? 'Total Variant Stock: '+tot+' ta' : '';
}
function render(){ document.getElementById('tabs').innerHTML=[['dashboard','📊 Dashboard'],['products','📦 পণ্য'],['orders','🛍️ অর্ডার'],['coupons','🎟️ Coupon'],['delivery','🚚 Delivery'],['feedback','⭐ Review'],['settings','⚙️ Settings']].map(t=>`<button onclick="tab='${t[0]}';render()" class="whitespace-nowrap px-4 py-2 rounded-full font-bold text-sm ${tab===t[0]?'tab-active bg-[#0a3d2e] text-white':'bg-white border shadow-sm'}">${t[1]}</button>`).join(''); let h='';
if(tab==='dashboard'){ let today=new Date().toDateString(); let todayOrders=ORDERS.filter(o=>new Date(o.date).toDateString()===today); let pending=ORDERS.filter(o=>o.status==='Pending'||o.status==='pending'); let totalSale=ORDERS.filter(o=>o.status!=='Rejected').reduce((s,o)=>s+(parseInt(o.total)||0),0); let low=PRODUCTS.filter(p=>p.stock<=5); h=`<div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3"><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">আজকের অর্ডার</p><b class="text-2xl md:text-3xl">${todayOrders.length} টা</b></div><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">মোট সেল</p><b class="text-2xl md:text-3xl">৳${totalSale.toLocaleString()}</b></div><div class="bg-yellow-100 p-4 rounded-2xl shadow-sm"><p class="text-xs">⏳ Pending</p><b class="text-2xl md:text-3xl">${pending.length} টা</b></div><div class="bg-white p-4 rounded-2xl shadow-sm"><p class="text-xs text-gray-500">মোট প্রোডাক্ট</p><b class="text-2xl md:text-3xl">${PRODUCTS.length} টা</b></div></div><div class="grid md:grid-cols-3 gap-2 md:gap-3 mt-3"><div class="bg-white p-4 rounded-2xl shadow-sm"><b>🎁 Active Coupons</b><p class="text-sm text-gray-500 mt-1">${COUPONS.filter(c=>c.active).map(c=>c.code+' - '+c.off+'%').join(', ')||'নাই'}</p><button onclick="tab='coupons';render()" class="bg-gray-900 text-white px-3 py-1.5 rounded-full text-xs font-bold mt-2">Manage →</button></div><div class="bg-white p-4 rounded-2xl shadow-sm"><b>🚚 Delivery Rules</b><p class="text-sm text-gray-500 mt-1">Dhaka ৳${SETTINGS.deliveryDhaka||60} | Baire ৳${SETTINGS.deliveryOutside||130} | Free ${SETTINGS.freeAbove||'0'}+ • ${SETTINGS.deliveryTime||''}</p><button onclick="tab='delivery';render()" class="bg-gray-900 text-white px-3 py-1.5 rounded-full text-xs font-bold mt-2">Edit →</button></div><div class="bg-white p-4 rounded-2xl shadow-sm"><b>⭐ Reviews</b><p class="text-sm text-gray-500 mt-1">${FEEDBACKS.length} ta review • ${FAQS.length} ta FAQ</p></div></div><div class="bg-red-50 p-4 rounded-2xl mt-3"><h3 class="font-black text-red-600">📦 Low Stock Alert</h3>${low.length?low.map(p=>`<p class="text-sm">⚠️ ${p.name} - Stock: <b>${p.stock}</b></p>`).join(''):'<p class="text-sm">✅ Sob thik ase</p>'}</div><div class="bg-white p-4 rounded-2xl shadow-sm mt-3"><b>📦 Recent Orders</b>${ORDERS.slice(0,5).map(o=>`<div class="flex justify-between border-t py-2 text-sm"><span><b>${o.orderId||o.id}</b> - ${o.name} • ৳${o.total}</span><span class="bg-yellow-100 px-2 rounded-full text-xs font-bold">${o.status}</span></div>`).join('')||'<p class="text-sm text-gray-500 mt-2">No orders yet</p>'}</div>`; }
if(tab==='products'){ h=`<div class="bg-white p-4 rounded-2xl shadow-sm"><h3 class="font-black">📂 Category Manager</h3><p class="text-xs text-gray-500">Category add korle Main Site e filter e chole jabe</p><div class="flex gap-2 mt-2"><input id="newCat" placeholder="New Category - e.g. Beauty" class="flex-1 border rounded-xl p-2"><button onclick="addCat()" class="bg-[#0a3d2e] text-white px-4 rounded-xl font-bold">+ Add</button></div><div class="flex gap-2 flex-wrap mt-2">${CATS.map(cat=>`<span class="bg-gray-100 px-3 py-1 rounded-full text-sm">${cat} ${cat!=='সব'?`<button onclick="delCat('${cat}')" class="text-red-500 font-bold">✕</button>`:''}</span>`).join('')}</div></div><div class="bg-white border-2 border-dashed border-yellow-500 rounded-2xl p-4 mt-3"><h3 class="font-black text-lg">➕ নতুন পণ্য যোগ করো</h3><input id="npName" placeholder="পণ্যের নাম *" class="w-full border rounded-lg p-3 mt-3"><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">দাম (৳) *</label><input id="npPrice" type="number" placeholder="1300" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">আগের দাম</label><input id="npOld" type="number" placeholder="1500" class="w-full border rounded-lg p-2"></div></div><div class="flex gap-2 mt-2"><div class="flex-1"><label class="text-sm">স্টক (Variant na dile)</label><input id="npStock" type="number" value="50" class="w-full border rounded-lg p-2"></div><div class="flex-1"><label class="text-sm">ক্যাটাগরি</label><select id="npCat" class="w-full border rounded-lg p-2">${CATS.filter(c=>c!=='সব').map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="bg-blue-50 p-3 rounded-xl mt-3"><b>🎨 Size + Color Wise Stock</b><p class="text-xs">Jemon: White - M - 10 ta, Black - L - 5 ta</p><p id="variantTotal" class="text-xs font-bold text-blue-700"></p><div id="variantList" class="space-y-2 mt-2"></div><button onclick="addVariantRow()" type="button" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold mt-2">+ Size / Color Add Koro</button></div><div class="grid grid-cols-2 gap-2 mt-3"><div><label class="text-sm font-bold">🏷️ Badge</label><select id="npBadge" class="w-full border rounded-lg p-2 mt-1"><option value="">কোনো Badge না</option><option>Best Seller</option><option>New</option><option>Hot Deal</option><option>Limited</option></select></div><div><label class="text-sm font-bold">📍 Location</label><select id="npLoc" class="w-full border rounded-lg p-2 mt-1"><option>Dhaka</option><option>Chattogram</option><option>Sylhet</option><option>Khulna</option><option>Rajshahi</option><option>Barishal</option></select></div></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="npEmoji" placeholder="Emoji 👕" class="border rounded-lg p-2"><select id="npCond" class="border rounded-lg p-2"><option>New</option><option>Used</option></select></div><label class="block text-sm mt-3 font-bold">📸 Product er Pic</label><div class="grid grid-cols-2 gap-2 mt-2"><label class="bg-pink-600 text-white text-center py-3 rounded-xl font-bold cursor-pointer">📸 Camera দিয়ে তোলো<input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleNewImgs(this)"></label><label class="bg-gray-900 text-white text-center py-3 rounded-xl font-bold cursor-pointer">🖼️ Gallery থেকে নাও<input type="file" accept="image/*" multiple class="hidden" onchange="handleNewImgs(this)"></label></div><input id="npImgUrl" placeholder="Or Image URL paste koro" class="w-full border rounded-lg p-2 mt-2" onchange="if(this.value){newImgs.push(this.value);renderNewPreview();this.value=''}"><div id="newPreview" class="flex gap-2 flex-wrap mt-3"></div><label class="block text-sm mt-3">বিবরণ</label><textarea id="npDesc" placeholder="কাপড়টা কেমন, size, quality..." class="w-full border rounded-lg p-2"></textarea><button onclick="addProduct()" class="w-full bg-yellow-500 py-4 rounded-xl font-black mt-3 text-lg">✅ পণ্য যোগ করো</button></div><button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold mt-3">🔄 রিফ্রেশ</button><div class="mt-3 space-y-3">${PRODUCTS.map(p=>`<div class="bg-white rounded-2xl p-3 shadow-sm ${p.stock<=5?'border-2 border-red-500':''}"><div class="flex justify-between gap-2"><b class="flex-1">${p.name} ${p.badge||''}</b><div class="flex gap-1 shrink-0"><button onclick="editId=${p.id};render()" class="bg-yellow-100 px-2 py-1 rounded-lg">✏️</button><button onclick="delProduct(${p.id})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div><p class="text-sm text-gray-500">${p.cat} • ৳${p.price} • স্টক: <b>${p.stock}</b> ${p.stock==0?'<span class="text-red-600 font-bold">- STOCK OUT</span>':''} • 📍 ${p.loc||'Dhaka'}</p>${(p.variants&&p.variants.length)?`<p class="text-xs bg-blue-50 p-2 rounded mt-1">🎨 ${p.variants.map(v=>`${v.color||v.name}-${v.size}: ${v.stock} ta`).join(' | ')}</p>`:''}<div class="flex gap-1 mt-2 flex-wrap">${(p.images||[]).map(im=>`<img src="${im}" class="w-14 h-14 object-cover rounded-lg">`).join('')||'Kono pic nai'}</div>${editId===p.id?`<div class="mt-2 bg-yellow-50 p-2 rounded-xl"><input id="eName${p.id}" value="${p.name}" class="w-full border rounded-lg p-2"><div class="flex gap-2 mt-1"><input id="ePrice${p.id}" type="number" value="${p.price}" class="flex-1 border rounded-lg p-2"><input id="eStock${p.id}" type="number" value="${p.stock}" class="flex-1 border rounded-lg p-2"></div><button onclick="saveEdit(${p.id})" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold mt-1">Save Edit</button><button onclick="editId=null;render()" class="w-full underline text-xs mt-1">Cancel</button></div>`:''}</div>`).join('')}</div>`; }
if(tab==='coupons'){ h=`<div class="bg-white p-4 rounded-2xl shadow-sm"><h3 class="font-black text-lg">🎟️ Coupon বানাও</h3><input id="cpCode" placeholder="Coupon Code - jemon EID20" class="w-full border rounded-lg p-3 mt-3"><input id="cpOff" type="number" placeholder="Discount % - jemon 20" class="w-full border rounded-lg p-3 mt-2"><label class="flex items-center gap-2 mt-2"><input id="cpActive" type="checkbox" checked> Active</label><button onclick="addCoupon()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold mt-3">➕ Coupon Add Koro</button></div><div class="mt-3 space-y-2">${COUPONS.map((c,i)=>`<div class="bg-white p-3 rounded-xl flex justify-between items-center shadow-sm"><div><b>${c.code}</b> - ${c.off}% OFF <span class="${c.active?'text-green-600':'text-red-500'}">${c.active?'✅ Active':'❌ Off'}</span></div><div class="flex gap-1"><button onclick="toggleCoupon(${i})" class="bg-yellow-100 px-2 py-1 rounded-lg text-sm">${c.active?'Off koro':'On koro'}</button><button onclick="delCoupon(${i})" class="bg-red-100 px-2 py-1 rounded-lg">🗑️</button></div></div>`).join('')||'Kono coupon nai'}</div>`; }
if(tab==='delivery'){ h=`<div class="bg-white p-4 rounded-2xl shadow-sm"><h3 class="font-black text-lg">🚚 Delivery Settings</h3><label class="block mt-3 text-sm font-bold">Dhaka er Vitore (৳)</label><input id="dDhaka" value="${SETTINGS.deliveryDhaka||60}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Dhaka er Baire (৳)</label><input id="dOutside" value="${SETTINGS.deliveryOutside||130}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Free Delivery - Koto Takar Upore?</label><input id="dFree" value="${SETTINGS.freeAbove||0}" type="number" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Delivery Time</label><input id="dTime" value="${SETTINGS.deliveryTime||'Dhaka te 24h, Baire 2-3 din'}" class="w-full border rounded-lg p-2"><button onclick="saveDelivery()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold mt-3">✅ Delivery Save Koro</button></div>`; }
if(tab==='orders'){ let list=ORDERS.filter(o=>{ let q=orderSearch.toLowerCase(); return (!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)) && (orderFilter==='All'||o.status===orderFilter); }); h=`<div class="flex gap-2"><button onclick="refresh().then(render)" class="flex-1 bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><button onclick="exportOrders()" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold">📥 Excel</button></div><input oninput="orderSearch=this.value;render()" value="${orderSearch}" placeholder="🔍 Nam / Phone diye khujo..." class="w-full border rounded-xl p-3 mt-2 bg-white"><select onchange="orderFilter=this.value;render()" class="w-full border rounded-xl p-2 mt-2 bg-white"><option value="All">সব অর্ডার (${ORDERS.length})</option><option value="Pending">⏳ Pending</option><option value="Approved">✅ Approved</option><option value="Shipped">📦 Shipped</option><option value="Delivered">🚚 Delivered</option><option value="Rejected">❌ Rejected</option></select><div class="mt-3 space-y-2">${list.length?list.map(o=>`<div class="bg-white p-3 rounded-xl shadow-sm"><b>${o.orderId} - ৳${o.total}</b> <span class="bg-yellow-100 px-2 rounded-full text-xs">${o.status}</span><p class="text-sm">👤 ${o.name} | 📞 ${o.phone}</p><p class="text-sm">📍 ${o.address}</p><p class="text-xs">🛍️ ${o.items}</p><p class="text-xs text-gray-500">${o.date} • 💳 ${o.payment||'COD'} ${o.trxId?'(Trx: '+o.trxId+')':''}</p><div class="flex gap-1 mt-2 flex-wrap">${o.status==='Pending'?`<button onclick="updateOrder('${o.id}','Approved')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">✅ Approve</button><button onclick="updateOrder('${o.id}','Rejected')" class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs font-bold">❌ Reject</button>`:''}${o.status==='Approved'?`<button onclick="updateOrder('${o.id}','Shipped')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold">📦 Shipped</button>`:''}${o.status==='Shipped'?`<button onclick="updateOrder('${o.id}','Delivered')" class="bg-green-700 text-white px-3 py-1 rounded-full text-xs font-bold">🚚 Delivered</button>`:''}<button onclick="delOrder('${o.id}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">Delete</button></div></div>`).join(''):'<p class="text-center py-8">Kono order nai</p>'}</div>`; }
if(tab==='feedback'){ h=`<button onclick="refresh().then(render)" class="w-full bg-white border-2 py-2 rounded-xl font-bold">🔄 রিফ্রেশ</button><div class="mt-3 space-y-2">${FEEDBACKS.length?FEEDBACKS.map(f=>`<div class="bg-white p-3 rounded-xl shadow-sm"><b>${f.name} - ⭐ ${f.rating||5}</b><p class="text-sm">${f.text}</p><p class="text-xs text-gray-500">${f.date} • ${f.product||''}</p>${f.img?`<img src="${f.img}" class="w-20 h-20 object-cover rounded-lg mt-1">`:''}<button onclick="delFb(${f.id})" class="text-red-500 text-xs font-bold">Delete</button></div>`).join(''):'<div class="text-center py-10 bg-white rounded-2xl"><div class="text-5xl">⭐</div><p class="text-gray-500 mt-2">Kono review nai<br>Customer review dile ekhane dekhabe!</p></div>'}</div>`; }
if(tab==='settings'){ let th=SETTINGS.theme||{primary:'#0a3d2e',accent:'#16a34a',header:'#ffffff',headerText:'#111111',btn:'#0a3d2e',btnText:'#ffffff',bg:'#f8fafc',card:'#ffffff',price:'#0a3d2e',topbar:'#0a3d2e'}; h=`<div class="bg-white p-4 rounded-2xl shadow-sm"><h3 class="font-black text-lg">🏷️ Brand Identity</h3><label class="block mt-3 text-sm font-bold">Shop er Nam</label><input id="setShop" value="${SETTINGS.shopName||'UNIQ SHOP'}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Logo Image URL</label><input id="setLogo" value="${SETTINGS.logo||''}" class="w-full border rounded-lg p-2"><label class="block bg-gray-50 border-dashed border p-3 rounded-xl text-center mt-2 cursor-pointer text-sm">📷 Logo Upload <input type="file" accept="image/*" class="hidden" onchange="uploadLogo(this)"></label>${SETTINGS.logo?`<div class="mt-2 flex gap-2 items-center"><img src="${SETTINGS.logo}" class="h-12 object-contain border rounded-lg"><button onclick="clearLogo()" class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-sm font-bold">🗑️ Remove Logo</button></div>`:''}</div><div class="bg-white p-4 rounded-2xl shadow-sm mt-3"><h3 class="font-black text-lg">🎨 Theme Colors - 10 ta Rong!</h3><div class="grid grid-cols-2 gap-3 mt-3">${[['primary','🎨 Primary'],['accent','🟠 Accent / CTA'],['header','⬛ Header BG'],['headerText','🔤 Header Text'],['btn','🟣 Button Color'],['btnText','⚪ Button Text'],['bg','🌸 Page BG'],['card','⬜ Card BG'],['price','💰 Price Color'],['topbar','⬛ Top Bar']].map(x=>`<div><label class="text-sm font-bold">${x[1]}</label><input id="t_${x[0]}" type="color" value="${th[x[0]]||'#0a3d2e'}" class="w-full h-11 rounded-xl border"></div>`).join('')}</div><div class="mt-3"><p class="font-bold text-sm">⚡ Ready Theme</p><div class="flex gap-2 flex-wrap mt-2"><button onclick="applyPreset('premium')" class="px-4 py-2 rounded-full text-white font-bold" style="background:#0a3d2e">💚 Premium Green</button><button onclick="applyPreset('pink')" class="px-4 py-2 rounded-full text-white font-bold" style="background:#db2777">💗 Pink</button><button onclick="applyPreset('blue')" class="px-4 py-2 rounded-full text-white font-bold" style="background:#1e40af">💙 Blue</button><button onclick="applyPreset('black')" class="px-4 py-2 rounded-full text-white font-bold" style="background:#111">🖤 Black</button><button onclick="applyPreset('orange')" class="px-4 py-2 rounded-full text-white font-bold" style="background:#ea580c">🧡 Orange</button></div></div></div><div class="bg-white p-4 rounded-2xl shadow-sm mt-3"><h3 class="font-black text-lg">🎯 Hero & Promo</h3><label class="block mt-3 text-sm font-bold">Hero Headline</label><input id="setHero" value="${(SETTINGS.heroTitle||'').replace(/<br>/g,' ')}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Hero Subtext</label><input id="setHeroSub" value="${SETTINGS.heroSub||''}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Flash Sale Banner</label><input id="setFlash" value="${SETTINGS.flash||''}" class="w-full border rounded-lg p-2"></div><div class="bg-white p-4 rounded-2xl shadow-sm mt-3"><h3 class="font-black text-lg">📞 Contact & Security</h3><label class="block mt-3 text-sm font-bold">WhatsApp / Chat Number</label><input id="setChat" value="${SETTINGS.chatNumber||''}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">যোগাযোগের সময়</label><input id="setTime" value="${SETTINGS.contactTime||''}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">bKash Number</label><input id="setBkash" value="${SETTINGS.bkashNumber||'01816314494'}" class="w-full border rounded-lg p-2"><label class="block mt-3 text-sm font-bold">Admin Password / Key</label><input id="setPass" placeholder="Notun password - khali rakhle ager tai thakbe" class="w-full border rounded-lg p-2"><button onclick="saveSettings()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white py-3 rounded-xl font-black mt-3">💾 Sob Save Koro</button></div>`; }
document.getElementById('content').innerHTML=h; if(tab==='products'){renderVariants();renderNewPreview();} }
async function handleNewImgs(inp){ let files=[...inp.files]; for(let f of files){ let d=await new Promise(res=>{let r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f)}); newImgs.push(d); } renderNewPreview(); }
function renderNewPreview(){ let el=document.getElementById('newPreview'); if(!el) return; el.innerHTML=newImgs.map((im,i)=>`<div class="relative"><img src="${im}" class="w-20 h-20 object-cover rounded-xl"><button onclick="newImgs.splice(${i},1);renderNewPreview()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">✕</button></div>`).join('')||'<p class="text-xs text-gray-500">Ekhono kono pic deya hoi nai</p>'; }
async function addCat(){let v=document.getElementById('newCat').value.trim();if(!v){toast('Category nam dao');return}if(!CATS.includes(v))CATS.push(v);await api('/api/admin/settings',{method:'POST',body:JSON.stringify({cats:CATS})});toast('✅ Category add hoise');await refresh();render();}
async function delCat(c){if(!confirm(c+' delete?'))return;CATS=CATS.filter(x=>x!==c);await api('/api/admin/settings',{method:'POST',body:JSON.stringify({cats:CATS})});await refresh();render();}
async function addProduct(){ let n=document.getElementById('npName').value.trim(), pr=parseInt(document.getElementById('npPrice').value), old=parseInt(document.getElementById('npOld').value)||pr, st=parseInt(document.getElementById('npStock').value||'50'); if(!n||!pr){toast('⚠️ Nam + Dam dao');return} let cleanVariants = newVariants.filter(v=>v.color.trim()!=='').map(v=>({color:v.color.trim(), name:v.color.trim(), size:v.size, stock:parseInt(v.stock)||0, price:pr})); let totalStock = cleanVariants.length ? cleanVariants.reduce((s,v)=>s+v.stock,0) : st; let imgs=[...newImgs]; await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n,cat:document.getElementById('npCat').value,price:pr,old,stock:totalStock,rating:4.8,badge:document.getElementById('npBadge').value,emoji:document.getElementById('npEmoji').value||'📦',desc:document.getElementById('npDesc').value,images:imgs,variants:cleanVariants,loc:document.getElementById('npLoc').value,cond:document.getElementById('npCond').value})}); newImgs=[]; newVariants=[]; await refresh(); render(); toast('✅ Product add hoise! Variant: '+cleanVariants.length+' ta'); }
async function delProduct(id){ if(!confirm('Delete korba?'))return; await api('/api/admin/products/'+id,{method:'DELETE'}); await refresh(); render(); toast('🗑️ Delete hoise'); }
async function saveEdit(id){ await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('eName'+id).value,price:parseInt(document.getElementById('ePrice'+id).value),stock:parseInt(document.getElementById('eStock'+id).value)})}); editId=null; await refresh(); render(); toast('✅ Edit save hoise'); }
async function addCoupon(){ let code=document.getElementById('cpCode').value.trim().toUpperCase(), off=parseInt(document.getElementById('cpOff').value); if(!code||!off){toast('Code + % dao');return} COUPONS.push({code,off,active:document.getElementById('cpActive').checked}); await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); toast('✅ Coupon add hoise!'); }
async function toggleCoupon(i){ COUPONS[i].active=!COUPONS[i].active; await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); }
async function delCoupon(i){ COUPONS.splice(i,1); await api('/api/admin/settings',{method:'POST',body:JSON.stringify({coupons:COUPONS})}); await refresh(); render(); }
async function saveDelivery(){ await api('/api/admin/settings',{method:'POST',body:JSON.stringify({deliveryDhaka:document.getElementById('dDhaka').value, deliveryOutside:document.getElementById('dOutside').value, freeAbove:document.getElementById('dFree').value, deliveryTime:document.getElementById('dTime').value})}); toast('✅ Delivery Save Hoise!'); await refresh(); render(); }
function uploadLogo(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{document.getElementById('setLogo').value=e.target.result;toast('✅ Logo ready! Save dao');};r.readAsDataURL(f);}
async function clearLogo(){await api('/api/admin/settings',{method:'POST',body:JSON.stringify({logo:''})});toast('✅ Logo remove');await refresh();render();}
async function saveSettings(){ let body={ chatNumber: document.getElementById('setChat').value, contactTime: document.getElementById('setTime').value, bkashNumber: document.getElementById('setBkash').value, shopName: document.getElementById('setShop').value, logo: document.getElementById('setLogo').value, heroTitle: document.getElementById('setHero').value, heroSub: document.getElementById('setHeroSub').value, flash: document.getElementById('setFlash').value, theme:{primary:document.getElementById('t_primary').value,accent:document.getElementById('t_accent').value,header:document.getElementById('t_header').value,headerText:document.getElementById('t_headerText').value,btn:document.getElementById('t_btn').value,btnText:document.getElementById('t_btnText').value,bg:document.getElementById('t_bg').value,card:document.getElementById('t_card').value,price:document.getElementById('t_price').value,topbar:document.getElementById('t_topbar').value} }; let np=document.getElementById('setPass').value.trim(); if(np) body.adminKey=np; await api('/api/admin/settings',{method:'POST',body:JSON.stringify(body)}); if(np){ KEY=np; localStorage.setItem('uniq_admin_key',np); } toast('✅ Sob Save Hoise!'); await refresh(); render(); }
async function applyPreset(name){let p={premium:{primary:'#0a3d2e',accent:'#16a34a',header:'#ffffff',headerText:'#111111',btn:'#0a3d2e',btnText:'#ffffff',bg:'#f8fafc',card:'#ffffff',price:'#0a3d2e',topbar:'#0a3d2e'},pink:{primary:'#db2777',accent:'#f97316',header:'#ffffff',headerText:'#000000',btn:'#db2777',btnText:'#ffffff',bg:'#fff5f5',card:'#ffffff',price:'#db2777',topbar:'#000000'},blue:{primary:'#1e40af',accent:'#0ea5e9',header:'#ffffff',headerText:'#000000',btn:'#1e40af',btnText:'#ffffff',bg:'#eff6ff',card:'#ffffff',price:'#1e40af',topbar:'#1e40af'},black:{primary:'#111111',accent:'#facc15',header:'#111111',headerText:'#ffffff',btn:'#111111',btnText:'#ffffff',bg:'#f5f5f5',card:'#ffffff',price:'#111111',topbar:'#000000'},orange:{primary:'#ea580c',accent:'#facc15',header:'#ffffff',headerText:'#000000',btn:'#ea580c',btnText:'#ffffff',bg:'#fff7ed',card:'#ffffff',price:'#ea580c',topbar:'#7c2d12'}}[name];await api('/api/admin/settings',{method:'POST',body:JSON.stringify({theme:p})});toast('✅ '+name+' Theme apply hoise!');await refresh();render();}
function cleanPhone(p){ let c=(p||'').replace(/[^0-9]/g,''); if(c.startsWith('0')) c='880'+c.slice(1); return c; }
async function updateOrder(id,status){ let o=ORDERS.find(x=>x.id==id); await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status})}); await refresh(); render(); toast('✅ Status: '+status); let msg={Approved:'✅ ORDER CONFIRMED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' APPROVED hoye gese. Total: ৳'+o.total, Shipped:'📦 SHIPPED - UNIQ SHOP\nHello '+o.name+'! Tomar Order '+o.orderId+' Pathano hoye gese!', Delivered:'🚚 DELIVERED - UNIQ SHOP\nHello '+o.name+'! Order '+o.orderId+' Delivered - Dhonnobad!'}[status]; if(msg) window.open('https://wa.me/'+cleanPhone(o.phone)+'?text='+encodeURIComponent(msg), '_blank'); }
async function delOrder(id){ if(!confirm('Delete?'))return; await api('/api/admin/orders/'+id,{method:'DELETE'}); await refresh(); render(); }
function exportOrders(){ let rows=[['OrderID','Name','Phone','Address','Items','Total','Status','Date']]; ORDERS.forEach(o=>rows.push([o.orderId,o.name,o.phone,(o.address||'').replace(/,/g,' '),(o.items||'').replace(/,/g,' '),o.total,o.status,o.date])); let csv=rows.map(r=>r.join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='uniq-orders.csv'; a.click(); toast('✅ Excel download hoise!'); }
async function delFb(id){ await api('/api/admin/feedbacks/'+id,{method:'DELETE'}); await refresh(); render(); }
if(KEY) init();
</script></body></html>
